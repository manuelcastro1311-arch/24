
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La mejor novia del universo</title>

<style>

* {
  box-sizing: border-box;
}

html.integrado,
html.integrado body {
  overflow: hidden;
}

body {
  margin: 0;
  background: #fff5f1;
  color: #9e2132;
  font-family: Georgia, serif;
  text-align: center;
}

#regalo {
  width: 100%;
  max-width: 560px;
  margin: auto;
  padding: 18px 10px 24px;
}

/* ENCABEZADO */

.encabezado {
  font-family: Arial, sans-serif;
  font-size: 10px;
  letter-spacing: 2px;
  color: #b44a57;
  margin: 6px 0 16px;
}

h1 {
  font-size: clamp(24px, 6vw, 35px);
  margin: 0 0 12px;
  line-height: 1.2;
}

#subtexto {
  font-size: 14px;
  line-height: 1.5;
  color: #a45561;
  height: 48px;
  margin: 10px auto 15px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* PERGAMINO ESTABLE */

.pergamino {
  width: 100%;
  max-width: 500px;
  margin: 30px auto 0;
  position: relative;
}

/* ESPACIO RESERVADO PARA EL DIPLOMA */

.escenario {
  position: relative;
  width: 100%;
  padding-top: 38px;
  padding-bottom: 25px;
}

/* PAPEL */

.papel {
  position: relative;
  width: calc(100% - 20px);
  margin: 0 auto;
  aspect-ratio: 3 / 2;
  background: #f7ebdf;
  box-shadow: 0 4px 12px #78322d18;

  clip-path: inset(0 0 100% 0);

  transition:
    clip-path 3s cubic-bezier(.35,.05,.25,1);
}

.pergamino.abierto .papel {
  clip-path: inset(0 0 0 0);
}

#diploma {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
}

/* ROLLO SUPERIOR */

.rollo-superior {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 46px;

  border: 1.5px solid #b66b67;
  border-radius: 30px;

  background: linear-gradient(
    to bottom,
    #d6b79c,
    #f8ead8 30%,
    #f2dfc9 55%,
    #d4b193 85%,
    #bd967b
  );

  box-shadow:
    0 4px 8px #78322d22,
    inset 0 2px 3px #ffffff66;

  padding: 0;
  cursor: pointer;
  z-index: 5;
  touch-action: manipulation;
}

.rollo-superior:disabled {
  cursor: default;
}

.rollo-superior::before,
.rollo-superior::after {
  content: "";
  position: absolute;
  top: 5px;
  bottom: 5px;
  width: 13px;
  border-radius: 50%;
  border: 1px solid #b66b67;

  background: linear-gradient(
    to right,
    #c39a7c,
    #f6e7d5,
    #c39a7c
  );
}

.rollo-superior::before {
  left: 3px;
}

.rollo-superior::after {
  right: 3px;
}

/* ROLLO INFERIOR */

/* Se desplaza sin modificar la altura de la pagina */

.rollo-inferior {
  position: absolute;

  top: 35px;
  left: 0;

  width: 100%;
  height: 29px;

  border: 1.5px solid #b66b67;
  border-radius: 25px;

  background: linear-gradient(
    to bottom,
    #c9a185,
    #f8ead8 35%,
    #ead0b5 65%,
    #c49a7c
  );

  box-shadow: 0 5px 9px #78322d22;

  z-index: 4;

  transition:
    top 3s cubic-bezier(.35,.05,.25,1);
}

.pergamino.abierto .rollo-inferior {
  top: calc(100% - 29px);
}

/* CINTA ROJA */

.cinta {
  position: absolute;
  top: -4px;
  left: 50%;

  width: 26px;
  height: 72px;

  transform: translateX(-50%);

  background: linear-gradient(
    to right,
    #9f1f31,
    #be2940,
    #98162c
  );

  border-radius: 3px;
  z-index: 6;
  pointer-events: none;

  transition:
    opacity .4s ease,
    transform .4s ease;
}

/* MOÑO */

.mono {
  position: absolute;
  top: -22px;
  left: 50%;

  transform: translateX(-50%);

  width: 88px;
  height: 74px;

  z-index: 7;
  pointer-events: none;

  transition:
    opacity .4s ease,
    transform .4s ease;
}

.pergamino.abierto .cinta,
.pergamino.abierto .mono {
  opacity: 0;
  transform: translateX(-50%) translateY(12px);
}

/* BOTONES */

.acciones {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;

  min-height: 82px;
  margin: 20px auto 0;

  visibility: hidden;
  opacity: 0;
  pointer-events: none;

  transition: opacity .4s ease;
}

.acciones.mostrar {
  visibility: visible;
  opacity: 1;
  pointer-events: auto;
}

.boton {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  align-self: flex-start;

  border: none;
  border-radius: 10px;

  background: #cf1735;
  color: #fff5f1;

  padding: 12px 16px;

  font-family: Georgia, serif;
  font-size: 13px;

  text-decoration: none;
  cursor: pointer;
}

.boton.secundario {
  background: #f2d6d3;
  color: #96263a;
}

.boton:hover {
  filter: brightness(.95);
}

button:focus-visible,
a:focus-visible {
  outline: 2px dashed #a30c29;
  outline-offset: 4px;
}

.decoracion {
  color: #cc7e87;
  letter-spacing: 6px;
  font-size: 17px;
  margin: 10px 0;
}

/* CORAZONES */

/* No afectan al tamaño de la ventana */

.particula {
  position: fixed;
  pointer-events: none;
  z-index: 9999;

  opacity: 0;
  line-height: 1;

  font-family: Arial, sans-serif;
}

@media (prefers-reduced-motion: reduce) {

  .papel,
  .rollo-inferior,
  .cinta,
  .mono,
  .acciones {
    transition: none;
  }

}

</style>
</head>

<body>

<main id="regalo">

  <p class="encabezado">
    ♡ RECONOCIMIENTO ESPECIAL ♡
  </p>

  <h1>Un premio muy merecido</h1>

  <p id="subtexto" aria-live="polite">
    Preparando tu pergamino...
  </p>

  <!-- PERGAMINO -->

  <div class="pergamino" id="pergamino">

    <div class="escenario">

      <!-- DIPLOMA ORIGINAL -->

      <div class="papel" id="papel" aria-hidden="true">

        <img
          id="diploma"
          alt="Diploma a la mejor novia del universo">

      </div>

      <!-- ROLLO SUPERIOR -->

      <button
        class="rollo-superior"
        id="abrir"
        type="button"
        aria-label="Abrir pergamino"
        aria-controls="papel"
        aria-expanded="false"
        disabled>
      </button>

      <!-- ROLLO INFERIOR -->

      <div class="rollo-inferior"></div>

      <!-- CINTA -->

      <div class="cinta"></div>

      <!-- MOÑO ROJO -->

      <svg class="mono"
        viewBox="0 0 100 80"
        aria-hidden="true">

        <path
          d="M50 28
             C4 -10 -8 52 50 28
             C108 52 96 -10 50 28Z"

          fill="#c92d43"
          stroke="#982335"
          stroke-width="2.4"/>

        <path
          d="M48 29
             L23 75 L40 66 L45 76 L52 34Z"

          fill="#af1f31"/>

        <path
          d="M52 29
             L77 75 L60 66 L55 76 L48 34Z"

          fill="#c92d43"/>

        <ellipse
          cx="50"
          cy="28"
          rx="9"
          ry="7"
          fill="#8f1c2e"/>

      </svg>

    </div>

  </div>

  <!-- ACCIONES -->

  <div class="acciones" id="acciones">

    <a
      class="boton"
      id="guardar"
      href="../diploma04.webp"
      download="Mi-diploma.webp">

      Guardar diploma ♡

    </a>

    <button
      class="boton secundario"
      id="reiniciar"
      type="button">

      Volver a enrollar

    </button>

  </div>

  <p class="decoracion">
    ♡ ─ ✧ ─ ♡
  </p>

</main>

<script>

/* EVITAR BARRAS DE DESPLAZAMIENTO INTERNAS */

if (window.parent !== window) {

  document.documentElement.classList.add("integrado");

}

/* ELEMENTOS */

const pergamino =
  document.getElementById("pergamino");

const papel =
  document.getElementById("papel");

const abrir =
  document.getElementById("abrir");

const reiniciar =
  document.getElementById("reiniciar");

const acciones =
  document.getElementById("acciones");

const subtexto =
  document.getElementById("subtexto");

const diploma =
  document.getElementById("diploma");

const guardar =
  document.getElementById("guardar");

let abierto = false;
let animando = false;

const reducirMovimiento = window.matchMedia(
  "(prefers-reduced-motion: reduce)"
);

/* CARGAR IMAGEN */

const archivos = [

  "../diploma04.webp",
  "../diploma04.png",
  "../diploma04.jpg",
  "../diploma04.jpeg",
  "../diploma04.WEBP",
  "../diploma04.PNG",
  "../diploma04.JPG",
  "../diploma04.JPEG"

];

let indice = 0;

diploma.addEventListener("load", () => {

  papel.style.aspectRatio =
    diploma.naturalWidth + " / " +
    diploma.naturalHeight;

  guardar.href = diploma.src;

  guardar.download =
    "Mi-diploma." + archivos[indice].split(".").pop();

  abrir.disabled = false;

  subtexto.textContent =
    "Toca el pergamino para descubrirlo.";

});

diploma.addEventListener("error", () => {

  indice++;

  if (indice < archivos.length) {

    diploma.src = archivos[indice];

  } else {

    subtexto.textContent =
      "No se encontró la imagen diploma04.";

  }

});

diploma.src = archivos[0];

/* ESPERA */

function esperar(ms) {

  return new Promise(resolve => setTimeout(resolve, ms));

}

/* ABRIR PERGAMINO */

async function abrirPergamino() {

  if (abierto || animando) return;

  abierto = true;
  animando = true;

  abrir.disabled = true;

  abrir.setAttribute("aria-expanded", "true");

  subtexto.textContent =
    "Un reconocimiento especial para usted...";

  pergamino.classList.add("abierto");

  await esperar(
    reducirMovimiento.matches ? 0 : 3050
  );

  papel.setAttribute("aria-hidden", "false");

  subtexto.textContent =
    "Para la mejor novia de todos los universos. ♡";

  acciones.classList.add("mostrar");

  animando = false;

  lanzarCorazones();

}

/* VOLVER A ENROLLAR */

async function cerrarPergamino() {

  if (!abierto || animando) return;

  animando = true;

  acciones.classList.remove("mostrar");

  papel.setAttribute("aria-hidden", "true");

  pergamino.classList.remove("abierto");

  abrir.setAttribute("aria-expanded", "false");

  await esperar(
    reducirMovimiento.matches ? 0 : 3050
  );

  abierto = false;
  animando = false;

  abrir.disabled = false;

  subtexto.textContent =
    "Toca el pergamino para descubrirlo.";

  abrir.focus({ preventScroll: true });

}

/* CORAZONES AL TERMINAR */

function lanzarCorazones() {

  if (reducirMovimiento.matches) return;

  if (!Element.prototype.animate) return;

  const colores = [

    "#cf1735",
    "#a30c29",
    "#ff8298",
    "#d84d69",
    "#e9a0b0"

  ];

  const rect =
    pergamino.getBoundingClientRect();

  const cx =
    rect.left + rect.width / 2;

  const cy =
    rect.top + rect.height * .4;

  for (let i = 0; i < 100; i++) {

    const particula =
      document.createElement("span");

    particula.className = "particula";

    particula.setAttribute("aria-hidden", "true");

    particula.textContent =
      ["♡", "♥", "✦"][i % 3];

    particula.style.left = cx + "px";

    particula.style.top = cy + "px";

    particula.style.color =
      colores[i % colores.length];

    particula.style.fontSize =
      (10 + Math.random() * 22) + "px";

    document.body.appendChild(particula);

    const angulo =
      Math.random() * Math.PI * 2;

    const distancia =
      50 + Math.random() * 190;

    const x =
      Math.cos(angulo) * distancia;

    const y =
      Math.sin(angulo) * distancia - 40;

    const giro =
      (Math.random() - .5) * 180;

    const animacion = particula.animate([

      {

        transform: "translate(0,0) scale(.2)",
        opacity: 0

      },

      {

        transform:
          `translate(${x * .4}px, ${y * .4}px)
           scale(1.1)`,

        opacity: 1,
        offset: .25

      },

      {

        transform:
          `translate(${x}px, ${y}px)
           rotate(${giro}deg)`,

        opacity: 0

      }

    ], {

      duration: 1100 + Math.random() * 900,

      delay: Math.random() * 150,

      easing: "ease-out",

      fill: "both"

    });

    animacion.finished
      .catch(() => {})
      .finally(() => particula.remove());

  }

}

/* ACTIVAR BOTONES */

abrir.addEventListener("click", abrirPergamino);

reiniciar.addEventListener("click", cerrarPergamino);

</script>

</body>
</html>
