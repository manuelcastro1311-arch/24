
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mensajitos que guardé</title>

<style>

* {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

html.integrado,
html.integrado body {
  overflow: hidden;
}

body {
  margin: 0;
  background: #fff5f1;
  color: #a30c29;
  font-family: Georgia, serif;
  text-align: center;
}

#regalo {
  width: 100%;
  max-width: 560px;
  margin: auto;
  padding: 22px 10px 24px;
  position: relative;
  overflow: hidden;
}

/* ENCABEZADO */

.mini {
  font: 9px Arial, sans-serif;
  letter-spacing: 2px;
  margin: 8px 0 16px;
}

h1 {
  font-size: clamp(25px, 6vw, 34px);
  font-weight: normal;
  margin: 0 0 20px;
}

/* COLLAGE DESORDENADO */

.collage {
  position: relative;
  width: 100%;
  aspect-ratio: 500 / 705;

  background-color: #fff8eb;

  background-image:
    radial-gradient(
      #c48d9438 .8px,
      transparent .8px
    );

  background-size: 16px 16px;

  border: 1px solid #dfc0b5;

  isolation: isolate;
}

/* POSICION DE CADA PAPELITO */

.recuerdo {
  position: absolute;

  left: var(--x);
  top: var(--y);

  width: var(--ancho);
  height: var(--alto);

  transform:
    translate(-50%, -50%)
    rotate(var(--giro));

  border: none;
  padding: 0;
  background: transparent;

  cursor: pointer;
  color: #a30c29;

  z-index: var(--capa);

  touch-action: pan-y;

  -webkit-tap-highlight-color: transparent;
}

/* PAPEL */

.papel {
  position: absolute;
  inset: 0;

  padding: 6px;

  background: #fffdf6;

  border: 1px solid #dfc2b8;

  border-radius: 2px;

  box-shadow:
    2px 5px 9px #66272d30;

  transition:
    transform .22s ease,
    box-shadow .22s ease;

  pointer-events: none;
}

/* CRECER AL PASAR EL MOUSE */

@media (hover: hover) {

  .recuerdo:hover {
    z-index: 100;
  }

  .recuerdo:hover .papel {

    transform:
      scale(1.08)
      rotate(calc(0deg - var(--giro) * .3));

    box-shadow:
      3px 9px 20px #66272d40;

  }

}

/* CRECER AL TOCAR CON EL DEDO */

.recuerdo.tocando,
.recuerdo:focus-visible {
  z-index: 100;
}

.recuerdo.tocando .papel,
.recuerdo:focus-visible .papel {

  transform: scale(1.08);

  box-shadow:
    3px 9px 20px #66272d40;

}

/* CAPTURA BORROSA */

.vista-previa {
  position: absolute;
  inset: 6px;

  background: #e9d8d2;

  overflow: hidden;
}

/* FONDO PROVISIONAL */

.vista-previa::before {
  content: "";

  position: absolute;
  inset: 10%;

  background:
    linear-gradient(#b9b4aa, #b9b4aa)
      0 5% / 65% 18% no-repeat,

    linear-gradient(#c7a3a9, #c7a3a9)
      100% 48% / 72% 18% no-repeat,

    linear-gradient(#b3b4a8, #b3b4a8)
      0 90% / 58% 18% no-repeat;

  filter: blur(6px);

  opacity: .65;
}

.vista-previa img {

  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;
  object-position: center;

  filter: blur(12px);

  transform: scale(1.3);

  opacity: .9;

  pointer-events: none;
  user-select: none;

  -webkit-user-drag: none;
}

.vista-previa::after {
  content: "";

  position: absolute;
  inset: 0;

  background: #e9b9b233;

  pointer-events: none;
}

/* CINTA ADHESIVA */

.cinta {
  position: absolute;

  top: -6px;
  left: 30%;

  width: 40%;
  height: 14px;

  background: #dba4a599;

  transform: rotate(-5deg);

  z-index: 3;

  clip-path: polygon(
    0 5%,
    100% 0,
    96% 25%,
    100% 45%,
    96% 65%,
    100% 100%,
    0 96%,
    4% 75%,
    0 50%,
    4% 25%
  );
}

/* NUMERO DE CADA MENSAJE */

.numero {
  position: absolute;

  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  width: clamp(26px, 8vw, 40px);
  height: clamp(26px, 8vw, 40px);

  display: flex;
  align-items: center;
  justify-content: center;

  border: 1px solid #c5838b;

  border-radius: 50%;

  background: #fff8e9;

  box-shadow: 0 2px 5px #66272d20;

  font-family: Georgia, serif;

  font-size: clamp(16px, 4.5vw, 24px);

  color: #a30c29;

  z-index: 4;
}

/* CORAZONES DECORATIVOS */

.corazon {
  position: absolute;

  color: #ba6574;

  font-size: 24px;

  pointer-events: none;

  z-index: 0;
}

.c1 {
  left: 4%;
  top: 23%;
  transform: rotate(-15deg);
}

.c2 {
  right: 4%;
  top: 35%;
  transform: rotate(12deg);
}

.c3 {
  left: 3%;
  top: 62%;
  transform: rotate(-12deg);
}

.c4 {
  right: 4%;
  top: 81%;
  transform: rotate(15deg);
}

.instrucciones {
  font-size: 12px;

  font-style: italic;

  color: #a65365;

  margin: 20px 0 10px;
}

/* MENSAJE AMPLIADO */

.detalle {
  animation: ampliar .4s ease both;
}

.hoja {
  position: relative;

  background: #fff8e9;

  border: 1px solid #d0a29c;

  padding: 24px 14px;

  box-shadow: 0 5px 15px #78322d18;
}

.hoja::before {
  content: "";

  position: absolute;
  inset: 5px;

  border: 1px solid #e1bfb0;

  pointer-events: none;
}

.numero-grande {

  font: 10px Arial, sans-serif;

  letter-spacing: 2px;

  margin: 4px 0 20px;
}

/* CAPTURA ORIGINAL */

#imagenGrande {
  display: block;

  width: auto;
  max-width: 100%;
  height: auto;

  margin: 0 auto;

  border-radius: 4px;

  box-shadow: 0 3px 10px #78322d20;
}

/* SI FALTA SUBIR LA IMAGEN */

#sinImagen {
  background: #f2dfd6;

  border: 1px dashed #d0a29c;

  padding: 55px 10px;

  font-size: 13px;

  color: #a65365;
}

/* DEDICATORIA */

.separador {
  display: flex;

  justify-content: center;
  align-items: center;

  gap: 12px;

  margin: 24px auto 15px;

  font-size: 25px;
}

.separador::before,
.separador::after {
  content: "";

  height: 1px;
  width: 45px;

  background: #d0a29c;
}

#dedicatoria {

  font-size: 17px;

  font-style: italic;

  line-height: 1.75;

  white-space: pre-wrap;

  overflow-wrap: anywhere;

  margin: 12px 6px 20px;
}

.frase-inferior {

  font: 9px Arial, sans-serif;

  letter-spacing: 1.5px;

  color: #a65365;

  margin: 16px 0 0;
}

/* BOTONES */

.boton {
  display: inline-block;

  background: #a30c29;
  color: #fff8e9;

  border: 1px solid #a30c29;
  border-radius: 6px;

  padding: 12px 19px;

  font-family: Georgia, serif;

  font-size: 14px;

  cursor: pointer;

  text-decoration: none;
}

.boton.secundario {
  background: transparent;

  color: #a30c29;

  border-color: #d0a29c;

  margin: 14px 0 0;

  font-size: 12px;
}

.cerrar {
  margin: 22px auto 0;
}

.decoracion {
  color: #cc7e87;

  letter-spacing: 6px;

  margin: 20px 0 0;
}

button:focus-visible,
a:focus-visible {
  outline: 2px dashed #a30c29;

  outline-offset: 3px;
}

/* ANIMACIONES */

@keyframes caer {

  from {

    opacity: 0;

    transform:
      translateY(-25px)
      rotate(-12deg)
      scale(.85);

  }

  to {

    opacity: 1;

    transform:
      translateY(0)
      rotate(0)
      scale(1);

  }

}

@keyframes ampliar {

  from {
    opacity: 0;
    transform: scale(.92);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }

}

@media (prefers-reduced-motion: reduce) {

  * {
    animation: none !important;
    transition: none !important;
  }

}

</style>
</head>

<body>

<main id="regalo">

  <!-- COLLAGE PRINCIPAL -->

  <section id="principal">

    <p class="mini">
      ♡ PEDACITOS DE NOSOTROS ♡
    </p>

    <h1>Mensajitos que guardé</h1>

    <div class="collage" id="collage"></div>

    <p class="instrucciones">
      Toque cualquier mensajito para descubrirlo.
    </p>

    <p class="decoracion">
      ♡ ─ ✧ ─ ♡
    </p>

  </section>

  <!-- MENSAJE AMPLIADO -->

  <section class="detalle"
           id="detalle"
           hidden>

    <article class="hoja">

      <p class="numero-grande"
         id="numeroGrande">

        RECUERDO N.º 01

      </p>

      <!-- CAPTURA COMPLETA -->

      <img
        id="imagenGrande"
        alt="Captura del mensaje"
        hidden>

      <div id="sinImagen">

        Fotografía pendiente

      </div>

      <!-- ABRIR IMAGEN ORIGINAL -->

      <a
        id="verOriginal"
        class="boton secundario"
        target="_blank"
        rel="noopener"
        hidden>

        Ver en tamaño original

      </a>

      <!-- DEDICATORIA -->

      <div class="separador">
        ♡
      </div>

      <p id="dedicatoria"></p>

      <p class="frase-inferior">
        UN MENSAJITO PARA RECORDAR
      </p>

    </article>

    <button
      id="cerrar"
      class="boton cerrar"
      type="button">

      Volver a nuestros mensajes

    </button>

    <p class="decoracion">
      ♡ ─ ✧ ─ ♡
    </p>

  </section>

</main>

<script>

/* EVITAR TEMBLORES EN EL CALENDARIO */

if (window.parent !== window) {

  document.documentElement.classList.add(
    "integrado"
  );

}

/* ===================================
   AQUI PONDREMOS TUS 17 DEDICATORIAS
   =================================== */

const dedicatorias = [

  "", // MENSAJE 01

  "", // MENSAJE 02

  "", // MENSAJE 03

  "", // MENSAJE 04

  "", // MENSAJE 05

  "", // MENSAJE 06

  "", // MENSAJE 07

  "", // MENSAJE 08

  "", // MENSAJE 09

  "", // MENSAJE 10

  "", // MENSAJE 11

  "", // MENSAJE 12

  "", // MENSAJE 13

  "", // MENSAJE 14

  "", // MENSAJE 15

  "", // MENSAJE 16

  ""  // MENSAJE 17

];

/* ===================================
   DISTRIBUCION IRREGULAR DEL COLLAGE

   Numero, X, Y, Ancho, Alto, Giro
   =================================== */

const posiciones = [

  [12, 101, 84, 166, 109, -13],

  [3, 265, 66, 159, 100, 8],

  [16, 408, 103, 137, 119, -9],

  [7, 170, 186, 176, 122, 13],

  [1, 341, 204, 180, 115, -12],

  [14, 80, 252, 132, 120, -8],

  [5, 221, 290, 170, 120, -10],

  [10, 407, 323, 138, 127, 10],

  [17, 103, 365, 166, 113, 13],

  [2, 300, 391, 170, 113, -8],

  [9, 163, 464, 169, 125, -13],

  [6, 415, 454, 126, 113, 9],

  [15, 65, 526, 111, 106, 9],

  [4, 326, 524, 181, 112, 12],

  [11, 211, 583, 158, 107, -7],

  [8, 99, 637, 154, 99, -9],

  [13, 385, 635, 166, 101, -10]

];

/* ELEMENTOS */

const $ = id => document.getElementById(id);

const collage = $("collage");

const principal = $("principal");

const detalle = $("detalle");

const imagenGrande = $("imagenGrande");

const reducir = matchMedia(
  "(prefers-reduced-motion: reduce)"
);

let solicitudActual = 0;

let ultimoBoton = null;

let abriendo = false;

/* FORMATOS DE IMAGEN */

const extensiones = [

  "png",
  "jpg",
  "jpeg",
  "webp",
  "PNG",
  "JPG",
  "JPEG",
  "WEBP"

];

const cacheImagenes = new Map();

/* NUMEROS DE DOS DIGITOS */

function numero(n) {

  return String(n).padStart(2, "0");

}

/* BUSCAR CAPTURA */

function buscarImagen(n) {

  if (cacheImagenes.has(n)) {

    return cacheImagenes.get(n);

  }

  const promesa = new Promise(resolve => {

    const nombre =
      "../mensaje" + numero(n);

    let intento = 0;

    const imagen = new Image();

    imagen.onload = () => {

      resolve(imagen.src);

    };

    imagen.onerror = () => {

      intento++;

      if (intento < extensiones.length) {

        imagen.src =
          nombre + "." + extensiones[intento];

      } else {

        resolve(null);

      }

    };

    imagen.src =
      nombre + "." + extensiones[intento];

  });

  cacheImagenes.set(n, promesa);

  return promesa;

}

/* CREAR COLLAGE */

function crearCollage() {

  /* CORAZONES DEL FONDO */

  for (let i = 1; i <= 4; i++) {

    const corazon =
      document.createElement("span");

    corazon.className =
      "corazon c" + i;

    corazon.textContent =
      i === 3 ? "✧" : "♡";

    corazon.setAttribute(
      "aria-hidden",
      "true"
    );

    collage.appendChild(corazon);

  }

  /* CREAR LOS 17 PAPELITOS */

  posiciones.forEach((datos, i) => {

    const [
      n,
      x,
      y,
      ancho,
      alto,
      giro
    ] = datos;

    const tarjeta =
      document.createElement("button");

    tarjeta.className = "recuerdo";

    tarjeta.type = "button";

    tarjeta.setAttribute(
      "aria-label",
      "Abrir mensaje " + n
    );

    /* UBICACION PERSONALIZADA */

    tarjeta.style.setProperty(
      "--x",
      (x / 500 * 100) + "%"
    );

    tarjeta.style.setProperty(
      "--y",
      (y / 705 * 100) + "%"
    );

    tarjeta.style.setProperty(
      "--ancho",
      (ancho / 500 * 100) + "%"
    );

    tarjeta.style.setProperty(
      "--alto",
      (alto / 705 * 100) + "%"
    );

    tarjeta.style.setProperty(
      "--giro",
      giro + "deg"
    );

    tarjeta.style.setProperty(
      "--capa",
      i + 1
    );

    /* PAPEL */

    const papel =
      document.createElement("div");

    papel.className = "papel";

    /* CAPTURA BORROSA */

    const vista =
      document.createElement("div");

    vista.className = "vista-previa";

    const imagen =
      document.createElement("img");

    imagen.alt = "";

    imagen.draggable = false;

    imagen.hidden = true;

    vista.appendChild(imagen);

    buscarImagen(n).then(ruta => {

      if (ruta) {

        imagen.src = ruta;

        imagen.hidden = false;

      }

    });

    /* CINTA ADHESIVA */

    const cinta =
      document.createElement("span");

    cinta.className = "cinta";

    /* NUMERO DEL MENSAJE */

    const circulo =
      document.createElement("span");

    circulo.className = "numero";

    circulo.textContent = n;

    /* ARMAR EL PAPELITO */

    papel.append(
      vista,
      cinta,
      circulo
    );

    tarjeta.appendChild(papel);

    /* ANIMACION DE ENTRADA */

    if (!reducir.matches) {

      papel.style.animation =

        `caer .6s ease ${i * 55}ms both`;

      papel.addEventListener(
        "animationend",
        () => {

          papel.style.animation = "";

        },
        { once: true }
      );

    }

    /* INTERACCION CON EL DEDO */

    let tactil = false;

    let tiempoToque;

    tarjeta.addEventListener(
      "pointerdown",
      e => {

        tactil = e.pointerType !== "mouse";

        if (tactil) {

          clearTimeout(tiempoToque);

          tarjeta.classList.add("tocando");

        }

      }
    );

    tarjeta.addEventListener(
      "pointercancel",
      () => {

        clearTimeout(tiempoToque);

        tarjeta.classList.remove("tocando");

        tactil = false;

      }
    );

    tarjeta.addEventListener(
      "pointerup",
      () => {

        tiempoToque = setTimeout(() => {

          tarjeta.classList.remove("tocando");

        }, 250);

      }
    );

    /* ABRIR AL SELECCIONAR */

    tarjeta.addEventListener(
      "click",
      () => {

        if (abriendo) return;

        abriendo = true;

        ultimoBoton = tarjeta;

        const demora =
          tactil && !reducir.matches
            ? 180
            : 0;

        setTimeout(() => {

          tarjeta.classList.remove(
            "tocando"
          );

          tactil = false;

          abrirMensaje(n);

        }, demora);

      }
    );

    collage.appendChild(tarjeta);

  });

}

/* ABRIR MENSAJE */

async function abrirMensaje(n) {

  const solicitud = ++solicitudActual;

  $("numeroGrande").textContent =

    "RECUERDO N.º " + numero(n);

  /* OCULTAR IMAGEN ANTERIOR */

  imagenGrande.hidden = true;

  imagenGrande.removeAttribute("src");

  $("verOriginal").hidden = true;

  $("sinImagen").hidden = false;

  $("sinImagen").textContent =

    "Cargando mensajito...";

  /* DEDICATORIA */

  $("dedicatoria").textContent =

    dedicatorias[n - 1] ||

    "Dedicatoria pendiente ♡";

  /* MOSTRAR MENSAJE COMPLETO */

  principal.hidden = true;

  detalle.hidden = false;

  detalle.scrollIntoView({

    block: "start",

    behavior: "auto"

  });

  /* CARGAR CAPTURA ORIGINAL */

  const ruta = await buscarImagen(n);

  if (solicitud !== solicitudActual) {

    return;

  }

  if (ruta) {

    imagenGrande.src = ruta;

    imagenGrande.hidden = false;

    $("sinImagen").hidden = true;

    $("verOriginal").href = ruta;

    $("verOriginal").hidden = false;

  } else {

    $("sinImagen").textContent =

      "Captura pendiente: mensaje" +

      numero(n) + ".png";

  }

}

/* REGRESAR AL COLLAGE */

function cerrarMensaje() {

  solicitudActual++;

  abriendo = false;

  detalle.hidden = true;

  principal.hidden = false;

  if (ultimoBoton) {

    ultimoBoton.focus({

      preventScroll: true

    });

    ultimoBoton.scrollIntoView({

      block: "nearest",

      behavior: "auto"

    });

  }

}

/* BOTON REGRESAR */

$("cerrar").addEventListener(

  "click",

  cerrarMensaje

);

/* CERRAR CON ESCAPE */

document.addEventListener(

  "keydown",

  e => {

    if (

      e.key === "Escape" &&

      !detalle.hidden

    ) {

      e.stopPropagation();

      cerrarMensaje();

    }

  }

);

/* INICIAR */

crearCollage();

</script>

</body>
</html>
