<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>17 cosas que nunca te he dicho</title>

<style>
*{
  box-sizing:border-box;
}

[hidden]{
  display:none !important;
}

html.integrado,
html.integrado body{
  overflow:hidden;
}

body{
  margin:0;
  background:#fff5f1;
  color:#a30c29;
  font-family:Georgia, serif;
  text-align:center;
}

#regalo{
  width:100%;
  max-width:560px;
  margin:auto;
  padding:18px 10px 18px;
  overflow:hidden;
}

.mini{
  font:9px Arial, sans-serif;
  letter-spacing:2px;
  margin:8px 0 14px;
}

h1{
  font-size:clamp(24px, 6vw, 34px);
  font-weight:normal;
  line-height:1.2;
  margin:0 0 14px;
}

.collage{
  position:relative;
  width:100%;
  aspect-ratio:500 / 435;
  background:#fff8eb;
  background-image:
    radial-gradient(#cf9aa72f .8px, transparent .8px);
  background-size:16px 16px;
  border:1px solid #dfc0b5;
  overflow:hidden;
  isolation:isolate;
}

.corazon{
  position:absolute;
  color:#c26b78;
  pointer-events:none;
  z-index:0;
  opacity:.8;
  font-size:16px;
}

.c1{ left:3%; top:10%; transform:rotate(-15deg); }
.c2{ right:5%; top:18%; transform:rotate(12deg); }
.c3{ left:5%; bottom:16%; transform:rotate(-10deg); }
.c4{ right:6%; bottom:7%; transform:rotate(10deg); }
.c5{ left:7%; bottom:5%; transform:rotate(-13deg); }

.nota{
  position:absolute;
  left:var(--x);
  top:var(--y);
  width:var(--w);
  height:var(--h);
  transform:translate(-50%, -50%) rotate(var(--r));
  border:none;
  background:transparent;
  padding:0;
  cursor:pointer;
  z-index:var(--z);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

.papel{
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(
      to bottom,
      #fffefb 0px,
      #fffefb 18px,
      #b8d2ef 19px,
      #fffefb 20px
    );
  border:1px solid #d7c6bb;
  border-radius:2px;
  box-shadow:2px 5px 10px #69292d20;
  overflow:hidden;
  pointer-events:none;
  transition:transform .18s ease, box-shadow .18s ease;
  transform-origin:center center;
}

.papel::before{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:18px;
  width:1.5px;
  background:#d88b93;
  opacity:.8;
}

.papel::after{
  content:"";
  position:absolute;
  top:-1px;
  left:0;
  width:100%;
  height:10px;
  background:#fff8f4;
  clip-path:polygon(
    0 100%, 5% 70%, 10% 100%, 14% 60%, 19% 100%, 24% 65%, 29% 100%,
    35% 72%, 40% 100%, 46% 68%, 51% 100%, 57% 62%, 63% 100%, 69% 66%,
    76% 100%, 82% 70%, 88% 100%, 94% 64%, 100% 100%, 100% 0, 0 0
  );
  opacity:.92;
  pointer-events:none;
}

.hoyitos{
  position:absolute;
  left:5px;
  top:12px;
  bottom:10px;
  width:12px;
  display:flex;
  flex-direction:column;
  justify-content:space-around;
  z-index:3;
}

.hoyitos span{
  width:8px;
  height:8px;
  margin:auto;
  border-radius:50%;
  background:#fff5f1;
  border:1px solid #e4d4cd;
  box-shadow:inset 0 1px 1px #00000010;
}

.preview{
  position:absolute;
  inset:10px 8px 8px 28px;
  text-align:left;
  overflow:hidden;
  z-index:1;
}

.preview-text{
  font:12px/1.55 Arial, sans-serif;
  color:#5f4f55;
  white-space:pre-wrap;
  word-break:break-word;
  filter:blur(3.5px);
  opacity:.72;
  user-select:none;
  pointer-events:none;
}

.preview::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    #fffefb55,
    #ffffff10 20%,
    #fff7f230 100%
  );
  pointer-events:none;
}

@media (hover:hover) and (pointer:fine){
  .nota:hover{
    z-index:150;
  }

  .nota:hover .papel{
    transform:scale(1.04);
    box-shadow:3px 8px 18px #69292d35;
  }
}

.instrucciones{
  font-size:12px;
  font-style:italic;
  color:#a65365;
  margin:12px 0 8px;
}

.decoracion{
  color:#cc7e87;
  letter-spacing:6px;
  margin:10px 0 0;
}

.detalle{
  animation:aparecer .25s ease both;
}

.hoja-abierta{
  position:relative;
  background:
    repeating-linear-gradient(
      to bottom,
      #fffefb 0px,
      #fffefb 28px,
      #b8d2ef 29px,
      #fffefb 30px
    );
  border:1px solid #d7c6bb;
  box-shadow:0 8px 20px #69292d22;
  padding:22px 18px 24px 38px;
  text-align:left;
  min-height:320px;
  overflow:hidden;
}

.hoja-abierta::before{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:28px;
  width:1.8px;
  background:#d88b93;
}

.hoja-abierta::after{
  content:"";
  position:absolute;
  top:-1px;
  left:0;
  width:100%;
  height:12px;
  background:#fff8f4;
  clip-path:polygon(
    0 100%, 5% 70%, 10% 100%, 14% 60%, 19% 100%, 24% 65%, 29% 100%,
    35% 72%, 40% 100%, 46% 68%, 51% 100%, 57% 62%, 63% 100%, 69% 66%,
    76% 100%, 82% 70%, 88% 100%, 94% 64%, 100% 100%, 100% 0, 0 0
  );
  opacity:.94;
}

.hoyitos-grandes{
  position:absolute;
  left:9px;
  top:18px;
  bottom:18px;
  width:14px;
  display:flex;
  flex-direction:column;
  justify-content:space-around;
}

.hoyitos-grandes span{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#fff5f1;
  border:1px solid #e4d4cd;
  box-shadow:inset 0 1px 1px #00000010;
  margin:auto;
}

.encabezado-abierto{
  text-align:center;
  font:11px Arial, sans-serif;
  letter-spacing:2px;
  color:#a45a67;
  margin:8px 0 18px;
  text-transform:uppercase;
}

.corazon-grande{
  text-align:center;
  font-size:34px;
  color:#ba4f63;
  margin:2px 0 14px;
}

#mensaje{
  font-size:18px;
  line-height:1.9;
  color:#7a3043;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  margin:8px 0 22px;
  text-align:left;
}

.firma{
  text-align:center;
  font-size:13px;
  font-style:italic;
  color:#a65365;
  margin-top:18px;
}

.boton{
  background:#a30c29;
  color:#fff8e9;
  border:1px solid #a30c29;
  border-radius:6px;
  padding:12px 18px;
  font-family:Georgia, serif;
  font-size:14px;
  cursor:pointer;
  margin-top:18px;
}

.boton:hover{
  background:#8d102a;
}

button:focus-visible{
  outline:2px dashed #a30c29;
  outline-offset:4px;
}

@keyframes aparecer{
  from{
    opacity:0;
    transform:scale(.98);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

@media (prefers-reduced-motion:reduce){
  *{
    animation:none !important;
    transition:none !important;
  }
}
</style>
</head>
<body>

<main id="regalo">

  <section id="principal">
    <p class="mini">♡ COSAS QUE NUNCA TE HE DICHO ♡</p>
    <h1>17 cosas que nunca te he dicho</h1>

    <div class="collage" id="collage"></div>

    <p class="instrucciones">Toque cualquier papelito para abrirlo.</p>
    <p class="decoracion">♡ ─ ✧ ─ ♡</p>
  </section>

  <section id="detalle" class="detalle" hidden>
    <article class="hoja-abierta">
      <div class="hoyitos-grandes">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>

      <p class="encabezado-abierto">Una cosita que nunca te he dicho</p>
      <div class="corazon-grande">♡</div>

      <p id="mensaje">Aquí irá una de las cosas que nunca te he dicho.</p>

      <p class="firma">Con mucho amor, de mí para usted.</p>
    </article>

    <button id="cerrar" class="boton" type="button">Volver a los papelitos</button>
    <p class="decoracion">♡ ─ ✧ ─ ♡</p>
  </section>

</main>

<script>
if (window.parent !== window) {
  document.documentElement.classList.add("integrado");
}

/* AQUÍ LUEGO PEGAMOS TUS 17 FRASES */
const mensajes = [
  "", "", "", "", "", "", "", "", "",
  "", "", "", "", "", "", "", ""
];

/*
[numeroInterno, x, y, ancho, alto, rotacion, z]
*/
const posiciones = [
  [1, 24, 15, 29, 13, -8, 6],
  [2, 46, 13, 29, 13, 7, 7],
  [3, 68, 15, 29, 13, -7, 8],
  [4, 86, 17, 24, 12, 6, 5],

  [5, 18, 28, 29, 13, 9, 9],
  [6, 39, 28, 29, 13, -7, 10],
  [7, 61, 29, 29, 13, 8, 11],
  [8, 82, 31, 25, 12, -7, 6],

  [9, 22, 42, 29, 13, -9, 12],
  [10, 45, 42, 29, 13, 7, 13],
  [11, 67, 42, 29, 13, -8, 14],
  [12, 86, 44, 23, 12, 8, 7],

  [13, 18, 57, 29, 13, 8, 15],
  [14, 40, 56, 29, 13, -7, 16],
  [15, 62, 57, 29, 13, 8, 17],
  [16, 82, 58, 25, 12, -8, 10],

  [17, 36, 71, 31, 13, -6, 18]
];

const $ = id => document.getElementById(id);
const collage = $("collage");
const principal = $("principal");
const detalle = $("detalle");
let ultimoBoton = null;

function textoPreview(n){
  return mensajes[n - 1] || "Aquí va una cosita bonita que solo se podrá leer al abrir el papelito.";
}

function crearDecoraciones(){
  const decoraciones = [
    ["♡","c1"],["✧","c2"],["♡","c3"],["♡","c4"],["✧","c5"]
  ];

  decoraciones.forEach(([txt, clase])=>{
    const el = document.createElement("span");
    el.className = "corazon " + clase;
    el.textContent = txt;
    el.setAttribute("aria-hidden","true");
    collage.appendChild(el);
  });
}

function crearHoyitos(){
  const wrap = document.createElement("div");
  wrap.className = "hoyitos";
  for(let i = 0; i < 5; i++){
    const s = document.createElement("span");
    wrap.appendChild(s);
  }
  return wrap;
}

function crearPapelitos(){
  crearDecoraciones();

  posiciones.forEach((datos)=>{
    const [n, x, y, w, h, r, z] = datos;

    const nota = document.createElement("button");
    nota.className = "nota";
    nota.type = "button";
    nota.setAttribute("aria-label", "Abrir papelito " + n);

    nota.style.setProperty("--x", x + "%");
    nota.style.setProperty("--y", y + "%");
    nota.style.setProperty("--w", w + "%");
    nota.style.setProperty("--h", h + "%");
    nota.style.setProperty("--r", r + "deg");
    nota.style.setProperty("--z", z);

    const papel = document.createElement("div");
    papel.className = "papel";

    const hoyitos = crearHoyitos();

    const preview = document.createElement("div");
    preview.className = "preview";

    const previewText = document.createElement("div");
    previewText.className = "preview-text";
    previewText.textContent = textoPreview(n);

    preview.appendChild(previewText);
    papel.appendChild(hoyitos);
    papel.appendChild(preview);
    nota.appendChild(papel);

    nota.addEventListener("click", ()=>{
      ultimoBoton = nota;
      abrirPapelito(n);
    });

    collage.appendChild(nota);
  });
}

function abrirPapelito(n){
  $("mensaje").textContent = mensajes[n - 1] || "Aquí irá una de las cosas que nunca te he dicho.";
  principal.hidden = true;
  detalle.hidden = false;
  window.scrollTo({ top: 0, behavior: "auto" });
}

function cerrarPapelito(){
  detalle.hidden = true;
  principal.hidden = false;

  if(ultimoBoton){
    ultimoBoton.focus({ preventScroll:true });
  }
}

$("cerrar").addEventListener("click", cerrarPapelito);

document.addEventListener("keydown", e=>{
  if(e.key === "Escape" && !detalle.hidden){
    cerrarPapelito();
  }
});

crearPapelitos();
</script>
</body>
</html>
