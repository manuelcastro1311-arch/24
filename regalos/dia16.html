<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>17 cosas que nunca te he dicho</title>

<style>
*{
  box-sizing:border-box;
}

[hidden]{
  display:none !important;
}

html.integrado,
html.integrado body{
  overflow:hidden;
}

body{
  margin:0;
  background:#fff5f1;
  color:#a30c29;
  font-family:Georgia, serif;
  text-align:center;
}

#regalo{
  width:100%;
  max-width:560px;
  margin:auto;
  padding:22px 10px 24px;
  overflow:hidden;
}

.mini{
  font:9px Arial, sans-serif;
  letter-spacing:2px;
  margin:10px 0 18px;
}

h1{
  font-size:clamp(25px, 6vw, 34px);
  font-weight:normal;
  line-height:1.2;
  margin:0 0 18px;
}

/* TABLERO */

.collage{
  position:relative;
  width:100%;
  aspect-ratio:500 / 700;
  background:#fff8eb;
  background-image:
    radial-gradient(#cf9aa72f .8px, transparent .8px);
  background-size:16px 16px;
  border:1px solid #dfc0b5;
  overflow:hidden;
  isolation:isolate;
}

/* DECORACIONES */

.corazon{
  position:absolute;
  color:#c26b78;
  pointer-events:none;
  z-index:0;
  opacity:.9;
}

.c1{ left:4%; top:10%; font-size:22px; transform:rotate(-15deg); }
.c2{ right:4%; top:24%; font-size:24px; transform:rotate(15deg); }
.c3{ left:3%; top:56%; font-size:20px; transform:rotate(-10deg); }
.c4{ right:5%; bottom:10%; font-size:22px; transform:rotate(12deg); }
.c5{ left:6%; bottom:5%; font-size:18px; transform:rotate(-12deg); }

/* PAPELITOS */

.nota{
  position:absolute;
  left:var(--x);
  top:var(--y);
  width:var(--w);
  height:var(--h);
  transform:translate(-50%, -50%) rotate(var(--r));
  border:none;
  background:transparent;
  padding:0;
  cursor:pointer;
  z-index:var(--z);
  touch-action:pan-y;
  -webkit-tap-highlight-color:transparent;
}

.papel{
  position:absolute;
  inset:0;
  background:
    /* líneas de cuaderno */
    repeating-linear-gradient(
      to bottom,
      #fffefb 0px,
      #fffefb 18px,
      #b8d2ef 19px,
      #fffefb 20px
    );
  border:1px solid #d7c6bb;
  border-radius:2px;
  box-shadow:2px 6px 12px #69292d25;
  overflow:hidden;
  transition:transform .22s ease, box-shadow .22s ease;
  pointer-events:none;
}

/* margen rojo vertical */
.papel::before{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:18px;
  width:1.5px;
  background:#d88b93;
  opacity:.8;
}

/* borde roto arriba */
.papel::after{
  content:"";
  position:absolute;
  top:-1px;
  left:0;
  width:100%;
  height:10px;
  background:#fff8f4;
  clip-path:polygon(
    0 100%, 5% 70%, 10% 100%, 14% 60%, 19% 100%, 24% 65%, 29% 100%,
    35% 72%, 40% 100%, 46% 68%, 51% 100%, 57% 62%, 63% 100%, 69% 66%,
    76% 100%, 82% 70%, 88% 100%, 94% 64%, 100% 100%, 100% 0, 0 0
  );
  opacity:.92;
  pointer-events:none;
}

/* hoyitos del espiral */
.hoyitos{
  position:absolute;
  left:5px;
  top:12px;
  bottom:10px;
  width:12px;
  display:flex;
  flex-direction:column;
  justify-content:space-around;
  z-index:3;
}

.hoyitos span{
  width:8px;
  height:8px;
  margin:auto;
  border-radius:50%;
  background:#fff5f1;
  border:1px solid #e4d4cd;
  box-shadow:inset 0 1px 1px #00000010;
}

/* texto vista previa */
.preview{
  position:absolute;
  inset:10px 8px 8px 28px;
  text-align:left;
  overflow:hidden;
  z-index:1;
}

.preview-text{
  font:12px/1.55 "Arial", sans-serif;
  color:#5f4f55;
  white-space:pre-wrap;
  word-break:break-word;
  filter:blur(3.4px);
  opacity:.72;
  transform:scale(1.01);
  user-select:none;
  pointer-events:none;
}

/* capa para que sí se vea que hay texto pero no se lea */
.preview::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    #fffefb55,
    #ffffff10 20%,
    #fff7f230 100%
  );
  pointer-events:none;
}

/* numero */
.numero{
  position:absolute;
  right:8px;
  top:8px;
  width:28px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#a30c29;
  color:#fff8e9;
  font:15px Georgia, serif;
  box-shadow:0 2px 6px #68282d30;
  z-index:5;
}

/* hover/touch */

@media (hover:hover){
  .nota:hover{
    z-index:200;
  }

  .nota:hover .papel{
    transform:scale(1.08);
    box-shadow:3px 10px 20px #69292d40;
  }
}

.nota.tocando,
.nota:focus-visible{
  z-index:200;
}

.nota.tocando .papel,
.nota:focus-visible .papel{
  transform:scale(1.08);
  box-shadow:3px 10px 20px #69292d40;
}

.instrucciones{
  font-size:12px;
  font-style:italic;
  color:#a65365;
  margin:18px 0 8px;
}

.decoracion{
  color:#cc7e87;
  letter-spacing:6px;
  margin:18px 0 0;
}

/* PAPELITO ABIERTO */

.detalle{
  animation:aparecer .28s ease both;
}

.hoja-abierta{
  position:relative;
  background:
    repeating-linear-gradient(
      to bottom,
      #fffefb 0px,
      #fffefb 28px,
      #b8d2ef 29px,
      #fffefb 30px
    );
  border:1px solid #d7c6bb;
  box-shadow:0 8px 20px #69292d22;
  padding:22px 18px 26px 38px;
  text-align:left;
  min-height:320px;
  overflow:hidden;
}

.hoja-abierta::before{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:28px;
  width:1.8px;
  background:#d88b93;
}

.hoja-abierta::after{
  content:"";
  position:absolute;
  top:-1px;
  left:0;
  width:100%;
  height:12px;
  background:#fff8f4;
  clip-path:polygon(
    0 100%, 5% 70%, 10% 100%, 14% 60%, 19% 100%, 24% 65%, 29% 100%,
    35% 72%, 40% 100%, 46% 68%, 51% 100%, 57% 62%, 63% 100%, 69% 66%,
    76% 100%, 82% 70%, 88% 100%, 94% 64%, 100% 100%, 100% 0, 0 0
  );
  opacity:.94;
}

.hoyitos-grandes{
  position:absolute;
  left:9px;
  top:18px;
  bottom:18px;
  width:14px;
  display:flex;
  flex-direction:column;
  justify-content:space-around;
}

.hoyitos-grandes span{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#fff5f1;
  border:1px solid #e4d4cd;
  box-shadow:inset 0 1px 1px #00000010;
  margin:auto;
}

.numero-grande{
  text-align:center;
  font:10px Arial, sans-serif;
  letter-spacing:2px;
  color:#a45a67;
  margin:8px 0 18px;
}

.corazon-grande{
  text-align:center;
  font-size:34px;
  color:#ba4f63;
  margin:2px 0 14px;
}

#mensaje{
  font-size:18px;
  line-height:1.9;
  color:#7a3043;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  margin:8px 0 22px;
  text-align:left;
}

.firma{
  text-align:center;
  font-size:13px;
  font-style:italic;
  color:#a65365;
  margin-top:18px;
}

.boton{
  background:#a30c29;
  color:#fff8e9;
  border:1px solid #a30c29;
  border-radius:6px;
  padding:12px 18px;
  font-family:Georgia, serif;
  font-size:14px;
  cursor:pointer;
  margin-top:20px;
}

.boton:hover{
  background:#8d102a;
}

button:focus-visible{
  outline:2px dashed #a30c29;
  outline-offset:4px;
}

@keyframes entrar{
  from{
    opacity:0;
    transform:translateY(-18px) scale(.88);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

@keyframes aparecer{
  from{
    opacity:0;
    transform:scale(.96);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

@media (prefers-reduced-motion:reduce){
  *{
    animation:none !important;
    transition:none !important;
  }
}
</style>
</head>
<body>

<main id="regalo">

  <section id="principal">
    <p class="mini">♡ COSAS QUE NUNCA TE HE DICHO ♡</p>

    <h1>17 cosas que nunca<br>te he dicho</h1>

    <div class="collage" id="collage"></div>

    <p class="instrucciones">
      Toque cualquier papelito para abrirlo.
    </p>

    <p class="decoracion">♡ ─ ✧ ─ ♡</p>
  </section>

  <section id="detalle" class="detalle" hidden>
    <article class="hoja-abierta">
      <div class="hoyitos-grandes">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>

      <p id="numeroGrande" class="numero-grande">
        PAPELITO N.º 01
      </p>

      <div class="corazon-grande">♡</div>

      <p id="mensaje">
        Aquí irá una de las cosas que nunca te he dicho.
      </p>

      <p class="firma">
        Con mucho amor, de mí para usted.
      </p>
    </article>

    <button id="cerrar" class="boton" type="button">
      Volver a los papelitos
    </button>

    <p class="decoracion">♡ ─ ✧ ─ ♡</p>
  </section>

</main>

<script>
if (window.parent !== window) {
  document.documentElement.classList.add("integrado");
}

/* AQUI PONDRAS TUS 17 MENSAJES */
const mensajes = [
  "", // 01
  "", // 02
  "", // 03
  "", // 04
  "", // 05
  "", // 06
  "", // 07
  "", // 08
  "", // 09
  "", // 10
  "", // 11
  "", // 12
  "", // 13
  "", // 14
  "", // 15
  "", // 16
  ""  // 17
];

/*
  NUMERO, X, Y, ANCHO, ALTO, GIRO, Z
  más amontonados / encimados
*/
const posiciones = [
  [6, 22, 15, 27, 14, -10, 3],
  [12, 43, 14, 29, 14, 8, 5],
  [2, 67, 16, 27, 14, -7, 4],
  [15, 83, 20, 25, 13, 10, 2],

  [9, 19, 28, 29, 14, 12, 7],
  [1, 37, 30, 31, 15, -11, 10],
  [17, 58, 28, 31, 15, 7, 9],
  [4, 79, 31, 29, 14, -8, 6],

  [11, 24, 43, 28, 14, -9, 11],
  [7, 46, 43, 33, 15, 9, 15],
  [13, 69, 43, 30, 15, -12, 14],
  [3, 84, 47, 25, 13, 8, 8],

  [16, 18, 58, 27, 14, 7, 12],
  [5, 36, 58, 30, 15, -10, 18],
  [10, 58, 57, 32, 15, 11, 20],
  [8, 79, 58, 28, 14, -9, 13],

  [14, 28, 72, 31, 14, 8, 16],
  [6, 50, 72, 29, 14, -8, 22],
  [12, 72, 72, 31, 15, 10, 21],

  [3, 18, 85, 25, 12, -7, 17],
  [4, 38, 85, 29, 13, 11, 19],
  [16, 61, 86, 30, 13, -9, 23],
  [17, 83, 86, 27, 12, 8, 24]
];

/* SOLO USAREMOS 17 */
const posicionesFinales = posiciones.slice(0, 17);

const $ = id => document.getElementById(id);

const collage = $("collage");
const principal = $("principal");
const detalle = $("detalle");

let ultimoBoton = null;
let bloqueado = false;

function pad(n){
  return String(n).padStart(2, "0");
}

function textoPreview(n){
  const t = (mensajes[n - 1] || "Aquí irá una cosita que nunca te he dicho y que solo se podrá leer al abrir el papelito.");
  return t;
}

function crearCorazones(){
  const decoraciones = [
    ["♡","c1"],["✧","c2"],["♡","c3"],["♡","c4"],["✧","c5"]
  ];

  decoraciones.forEach(([txt, clase])=>{
    const el = document.createElement("span");
    el.className = "corazon " + clase;
    el.textContent = txt;
    el.setAttribute("aria-hidden","true");
    collage.appendChild(el);
  });
}

function crearHoyitos(){
  const wrap = document.createElement("div");
  wrap.className = "hoyitos";
  for(let i=0;i<5;i++){
    const s = document.createElement("span");
    wrap.appendChild(s);
  }
  return wrap;
}

function crearPapelitos(){
  crearCorazones();

  posicionesFinales.forEach((datos, i)=>{
    const [n, x, y, w, h, r, z] = datos;

    const nota = document.createElement("button");
    nota.className = "nota";
    nota.type = "button";
    nota.setAttribute("aria-label", "Abrir papelito " + n);

    nota.style.setProperty("--x", x + "%");
    nota.style.setProperty("--y", y + "%");
    nota.style.setProperty("--w", w + "%");
    nota.style.setProperty("--h", h + "%");
    nota.style.setProperty("--r", r + "deg");
    nota.style.setProperty("--z", z);

    const papel = document.createElement("div");
    papel.className = "papel";
    papel.style.animation = `entrar .5s ease ${i * 45}ms both`;

    const hoyitos = crearHoyitos();

    const preview = document.createElement("div");
    preview.className = "preview";

    const previewText = document.createElement("div");
    previewText.className = "preview-text";
    previewText.textContent = textoPreview(n);

    preview.appendChild(previewText);

    const numero = document.createElement("span");
    numero.className = "numero";
    numero.textContent = n;

    papel.appendChild(hoyitos);
    papel.appendChild(preview);
    papel.appendChild(numero);
    nota.appendChild(papel);

    let tactil = false;
    let timer;

    nota.addEventListener("pointerdown", e=>{
      tactil = e.pointerType !== "mouse";
      if(tactil){
        clearTimeout(timer);
        nota.classList.add("tocando");
      }
    });

    nota.addEventListener("pointercancel", ()=>{
      clearTimeout(timer);
      nota.classList.remove("tocando");
      tactil = false;
    });

    nota.addEventListener("pointerup", ()=>{
      timer = setTimeout(()=>{
        nota.classList.remove("tocando");
      }, 220);
    });

    nota.addEventListener("click", ()=>{
      if(bloqueado) return;
      bloqueado = true;
      ultimoBoton = nota;

      const delay = tactil ? 150 : 0;

      setTimeout(()=>{
        nota.classList.remove("tocando");
        tactil = false;
        abrirPapelito(n);
      }, delay);
    });

    collage.appendChild(nota);
  });
}

function abrirPapelito(n){
  $("numeroGrande").textContent = "PAPELITO N.º " + pad(n);
  $("mensaje").textContent = mensajes[n - 1] || "Aquí irá una de las cosas que nunca te he dicho.";

  principal.hidden = true;
  detalle.hidden = false;

  detalle.scrollIntoView({
    block:"start",
    behavior:"auto"
  });

  bloqueado = false;
}

function cerrarPapelito(){
  detalle.hidden = true;
  principal.hidden = false;

  if(ultimoBoton){
    ultimoBoton.focus({ preventScroll:true });
    ultimoBoton.scrollIntoView({
      block:"nearest",
      behavior:"auto"
    });
  }
}

$("cerrar").addEventListener("click", cerrarPapelito);

document.addEventListener("keydown", e=>{
  if(e.key === "Escape" && !detalle.hidden){
    e.stopPropagation();
    cerrarPapelito();
  }
});

crearPapelitos();
</script>
</body>
</html>
