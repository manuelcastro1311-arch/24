
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La mejor novia del universo</title>

<style>

* {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

body {
  margin: 0;
  background: #fff5f6;
  color: #a30c29;
  font-family: Georgia, serif;
  text-align: center;
}

#regalo {
  width: 100%;
  max-width: 540px;
  margin: auto;
  padding: 15px 8px 24px;
}

/* ENCABEZADO */

.encabezado {
  font-family: Arial, sans-serif;
  font-size: 10px;
  letter-spacing: 2px;
  margin: 8px 0 18px;
}

h1 {
  font-size: clamp(25px, 6vw, 34px);
  line-height: 1.2;
  margin: 12px 0;
}

#instrucciones {
  font-size: 14px;
  color: #a65365;
  line-height: 1.6;
  margin: 12px auto;
}

/* CONTENEDOR DEL PERGAMINO */

.pergamino {
  position: relative;
  width: 100%;
  max-width: 490px;
  margin: 45px auto 25px;
}

/* ROLLO SUPERIOR */

.rollo-superior {
  display: block;
  position: relative;
  width: 100%;
  height: 46px;
  padding: 0;
  border: 1px solid #c9a47f;
  border-radius: 30px;
  background: linear-gradient(
    to bottom,
    #d2af8a 0%,
    #fff1d7 30%,
    #ecd1ad 68%,
    #bd9672 100%
  );
  box-shadow:
    0 5px 10px #73492b30,
    inset 0 2px 4px #ffffff55;
  cursor: pointer;
  z-index: 4;
  transition: filter .2s;
  touch-action: manipulation;
}

.rollo-superior:not(:disabled):hover {
  filter: brightness(1.04);
}

.rollo-superior:disabled {
  cursor: default;
}

/* EXTREMOS DEL ROLLO */

.rollo-superior::before,
.rollo-superior::after {
  content: "";
  position: absolute;
  top: 4px;
  bottom: 4px;
  width: 11px;
  border-radius: 50%;
  border: 1px solid #bc9270;
  background: linear-gradient(
    to right,
    #c09b77,
    #eed6b6,
    #c09b77
  );
}

.rollo-superior::before {
  left: 1px;
}

.rollo-superior::after {
  right: 1px;
}

/* CINTA ROJA */

.cinta {
  position: absolute;
  width: 25px;
  height: 67px;
  left: calc(50% - 12.5px);
  top: -5px;
  border-radius: 3px;
  background: linear-gradient(
    to right,
    #a30c29,
    #cf1735,
    #b71030
  );
  box-shadow: 1px 2px 4px #65001c33;
  transition:
    opacity .45s ease,
    transform .45s ease;
  z-index: 5;
  pointer-events: none;
}

.mono {
  position: absolute;
  width: 90px;
  height: 75px;
  top: -18px;
  left: -32.5px;
  overflow: visible;
}

/* DESAPARECER EL MOÑO */

.pergamino.abierto .cinta {
  opacity: 0;
  transform: translateY(25px) rotate(15deg);
}

/* PAPEL QUE SE DESENROLLA */

.papel {
  display: grid;
  grid-template-rows: 0fr;
  margin: -7px 8px;
  background: #fff1dc;
  box-shadow: 0 4px 12px #74482a22;
  transition:
    grid-template-rows 2.8s
    cubic-bezier(.25,.65,.3,1);
}

.papel-interior {
  min-height: 0;
  overflow: hidden;
  position: relative;
}

.pergamino.abierto .papel {
  grid-template-rows: 1fr;
}

/* IMAGEN DEL DIPLOMA */

#diploma {
  display: block;
  width: 100%;
  height: auto;
  margin: 0;
  user-select: none;
  -webkit-user-drag: none;
}

/* ROLLO INFERIOR */

.rollo-inferior {
  height: 28px;
  width: 100%;
  position: relative;
  border: 1px solid #c9a47f;
  border-radius: 20px;
  background: linear-gradient(
    to bottom,
    #c19b75,
    #ffedcf 36%,
    #ecd0ac 66%,
    #c29a74
  );
  box-shadow: 0 6px 10px #73492b30;
  z-index: 3;
}

/* BOTONES DEL FINAL */

#acciones {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin: 25px auto 10px;
  animation: aparecer .6s ease both;
}

.boton {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: none;
  border-radius: 9px;
  background: #cf1735;
  color: #fff5f6;
  padding: 12px 17px;
  font-family: Georgia, serif;
  font-size: 13px;
  font-weight: bold;
  text-decoration: none;
  cursor: pointer;
}

.boton.secundario {
  background: #ffd5dc;
  color: #a30c29;
}

.boton:hover {
  filter: brightness(.95);
}

button:focus-visible,
a:focus-visible {
  outline: 2px dashed #a30c29;
  outline-offset: 5px;
}

.decoracion {
  margin: 25px 0 5px;
  color: #cd7489;
  letter-spacing: 6px;
  font-size: 17px;
}

/* CORAZONES ANIMADOS */

.particula {
  position: fixed;
  pointer-events: none;
  z-index: 999;
  font-family: Arial, sans-serif;
  line-height: 1;
  opacity: 0;
}

/* ANIMACIONES */

@keyframes aparecer {

  from {
    opacity: 0;
    transform: translateY(10px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}

@keyframes flotar {

  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-5px);
  }

}

.pergamino.esperando {
  animation: flotar 3.5s ease-in-out infinite;
}

@media (prefers-reduced-motion: reduce) {

  .pergamino.esperando {
    animation: none;
  }

  .papel,
  .cinta {
    transition: none;
  }

  #acciones {
    animation: none;
  }

}

</style>
</head>

<body>

<main id="regalo">

  <p class="encabezado">
    ♡ UN RECONOCIMIENTO ESPECIAL ♡
  </p>

  <h1>Un premio muy merecido</h1>

  <p id="instrucciones" aria-live="polite">
    Preparando tu pergamino...
  </p>

  <!-- PERGAMINO -->

  <div class="pergamino" id="pergamino">

    <!-- ROLLO SUPERIOR -->

    <button
      class="rollo-superior"
      id="abrir"
      type="button"
      aria-label="Desenrollar el pergamino"
      aria-controls="papel"
      aria-expanded="false"
      disabled>

      <!-- CINTA Y MOÑO -->

      <span class="cinta">

        <svg class="mono"
          viewBox="0 0 100 80"
          aria-hidden="true">

          <path
            d="M50 29
               C3 -9 -9 52 50 29
               C109 52 97 -9 50 29Z"
            fill="#cf1735"
            stroke="#a30c29"
            stroke-width="2"/>

          <path
            d="M48 29
               L24 74
               L39 66
               L45 76
               L53 34Z"
            fill="#b71030"/>

          <path
            d="M52 29
               L76 74
               L61 66
               L55 76
               L47 34Z"
            fill="#cf1735"/>

          <ellipse
            cx="50"
            cy="29"
            rx="9"
            ry="7"
            fill="#a30c29"/>

        </svg>

      </span>

    </button>

    <!-- PAPEL Y DIPLOMA -->

    <div class="papel" id="papel" aria-hidden="true">

      <div class="papel-interior">

        <img
          id="diploma"
          alt="Diploma a la mejor novia del universo">

      </div>

    </div>

    <!-- ROLLO INFERIOR -->

    <div class="rollo-inferior"></div>

  </div>

  <!-- BOTONES -->

  <div id="acciones" hidden>

    <a
      class="boton"
      id="guardar"
      href="../diploma04.png"
      download="Mi-diploma.png">

      Guardar mi diploma ♡

    </a>

    <button
      class="boton secundario"
      id="reiniciar"
      type="button">

      Volver a enrollar

    </button>

  </div>

  <p class="decoracion">
    ♡ ─ ✧ ─ ♡
  </p>

</main>

<script>

/* CONFIGURACION */

const pergamino =
  document.getElementById("pergamino");

const papel =
  document.getElementById("papel");

const abrir =
  document.getElementById("abrir");

const acciones =
  document.getElementById("acciones");

const instrucciones =
  document.getElementById("instrucciones");

const diploma =
  document.getElementById("diploma");

const guardar =
  document.getElementById("guardar");

const reiniciar =
  document.getElementById("reiniciar");

let abierto = false;
let animando = false;

const reducirMovimiento = window.matchMedia(
  "(prefers-reduced-motion: reduce)"
);

/* CARGAR EL DIPLOMA */

const archivos = [
  "../diploma04.png",
  "../diploma04.jpg",
  "../diploma04.jpeg",
  "../diploma04.webp",
  "../diploma04.PNG",
  "../diploma04.JPG",
  "../diploma04.JPEG",
  "../diploma04.WEBP"
];

let indice = 0;

diploma.addEventListener("load", () => {

  guardar.href = diploma.src;

  const extension =
    archivos[indice].split(".").pop();

  guardar.download =
    "Diploma-mejor-novia." + extension;

  instrucciones.textContent =
    "Toca el pergamino para descubrirlo.";

  abrir.disabled = false;

  pergamino.classList.add("esperando");

});

diploma.addEventListener("error", () => {

  indice++;

  if (indice < archivos.length) {

    diploma.src = archivos[indice];

  } else {

    instrucciones.textContent =
      "No se encontró el diploma. " +
      "Comprueba que diploma04.png esté en GitHub.";

    abrir.disabled = true;

  }

});

diploma.src = archivos[0];

/* FUNCION DE ESPERA */

function pausa(ms) {

  return new Promise(resolve => {

    setTimeout(resolve, ms);

  });

}

/* ABRIR PERGAMINO */

async function abrirPergamino() {

  if (abierto || animando) return;

  abierto = true;
  animando = true;
  abrir.disabled = true;

  pergamino.classList.remove("esperando");

  instrucciones.textContent =
    "Un reconocimiento hecho especialmente para usted...";

  /* PEQUEÑO MOVIMIENTO ANTES DE ABRIR */

  if (!reducirMovimiento.matches && pergamino.animate) {

    await pergamino.animate([

      { transform: "rotate(0deg)" },

      { transform: "rotate(-2deg)" },

      { transform: "rotate(2deg)" },

      { transform: "rotate(0deg)" }

    ], {

      duration: 350,
      easing: "ease-in-out"

    }).finished.catch(() => {});

  }

  /* QUITAR EL MOÑO Y DESENROLLAR */

  pergamino.classList.add("abierto");

  abrir.setAttribute("aria-expanded", "true");

  await pausa(

    reducirMovimiento.matches ? 0 : 2900

  );

  papel.setAttribute("aria-hidden", "false");

  instrucciones.textContent =
    "Para la mejor novia de todos los universos. ♡";

  acciones.hidden = false;

  animando = false;

  lanzarCorazones();

}

/* VOLVER A ENROLLAR */

async function cerrarPergamino() {

  if (!abierto || animando) return;

  animando = true;

  acciones.hidden = true;

  papel.setAttribute("aria-hidden", "true");

  pergamino.classList.remove("abierto");

  abrir.setAttribute("aria-expanded", "false");

  await pausa(

    reducirMovimiento.matches ? 0 : 2900

  );

  abierto = false;
  animando = false;

  abrir.disabled = false;

  instrucciones.textContent =
    "Toca el pergamino para descubrirlo.";

  pergamino.classList.add("esperando");

  try {

    if (window.parent !== window) {

      const modal =
        window.parent.document.getElementById("modal");

      if (modal) {

        modal.scrollTop = 0;

      }

    }

  } catch (error) {}

  window.scrollTo(0, 0);

}

/* CELEBRACION CON CORAZONES */

function lanzarCorazones() {

  if (reducirMovimiento.matches) return;

  if (!Element.prototype.animate) return;

  const colores = [

    "#cf1735",
    "#a30c29",
    "#ff8298",
    "#e9a0b0",
    "#d84d69"

  ];

  const posicion =
    pergamino.getBoundingClientRect();

  const centroX =
    posicion.left + posicion.width / 2;

  const centroY =
    posicion.top + posicion.height * .4;

  for (let i = 0; i < 65; i++) {

    const particula =
      document.createElement("span");

    particula.className = "particula";

    particula.setAttribute("aria-hidden", "true");

    particula.textContent =

      ["♡", "♥", "✦"][i % 3];

    particula.style.left = centroX + "px";
    particula.style.top = centroY + "px";

    particula.style.color =
      colores[i % colores.length];

    particula.style.fontSize =
      (10 + Math.random() * 20) + "px";

    document.body.appendChild(particula);

    const angulo =
      Math.random() * Math.PI * 2;

    const distancia =
      50 + Math.random() * 190;

    const x =
      Math.cos(angulo) * distancia;

    const y =
      Math.sin(angulo) * distancia - 40;

    const giro =
      (Math.random() - .5) * 180;

    const animacion = particula.animate([

      {
        transform: "translate(0,0) scale(.2)",
        opacity: 0
      },

      {
        transform:
          `translate(${x * .4}px, ${y * .4}px)
           scale(1.1)`,
        opacity: 1,
        offset: .25
      },

      {
        transform:
          `translate(${x}px, ${y}px)
           rotate(${giro}deg)`,
        opacity: 0
      }

    ], {

      duration: 1100 + Math.random() * 900,

      delay: Math.random() * 150,

      easing: "ease-out",

      fill: "both"

    });

    animacion.finished

      .catch(() => {})

      .finally(() => particula.remove());

  }

}

/* ACTIVAR LOS BOTONES */

abrir.addEventListener(

  "click",

  abrirPergamino

);

reiniciar.addEventListener(

  "click",

  cerrarPergamino

);

</script>

</body>
</html>
