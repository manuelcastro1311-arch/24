
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24 días contigo</title>

<style>

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #cf1735;
  color: #fff3f3;
  font-family: Georgia, serif;
  text-align: center;
}

header { padding: 28px 16px 14px; }

.fecha {
  font-size: 13px;
  letter-spacing: 2px;
}

h1 {
  font-size: clamp(32px, 7vw, 60px);
  margin: 12px 0;
}

.subtitulo {
  font-size: 16px;
  margin: 8px 0;
}

.decoracion {
  margin-top: 14px;
  letter-spacing: 5px;
}

/* CALENDARIO PRINCIPAL */

.contenedor {
  width: min(94vw, 650px);
  margin: 18px auto;
  padding: clamp(7px, 1.8vw, 12px);
  background: #ed203c;
  border-radius: 24px;
}

.calendario {
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #b90e29;
  border-radius: 16px;
  padding: clamp(6px, 1.5vw, 10px);
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-template-rows: repeat(6, minmax(0, 1fr));
  gap: clamp(5px, 1.2vw, 10px);

  grid-template-areas:
    "d7  d15 d1  d1  d22 d10"
    "d24 d24 d4  d13 d9  d9"
    "d24 d24 d20 d13 d18 d2"
    "d5  d16 d11 d11 d3  d23"
    "d19 d8  d14 d12 d3  d21"
    "d19 d17 d17 d6  d6  d21";
}

.puerta {
  position: relative;
  min-width: 0;
  min-height: 0;
  padding: 0;
  border: none;
  border-radius: clamp(6px, 1.5vw, 12px);
  background: #fffafa;
  color: #e51e3c;
  cursor: pointer;
  overflow: hidden;
  font-family: Arial, sans-serif;
  transition: transform .2s, box-shadow .2s;
  box-shadow: 0 3px 5px #77001944;
}

.puerta::after {
  content: "";
  position: absolute;
  inset: clamp(3px, .7vw, 6px);
  border: 1.5px dashed #e58b99;
  border-radius: 5px;
  pointer-events: none;
}

.puerta:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 10px #76001866;
  z-index: 5;
}

.puerta:focus-visible {
  outline: 3px solid #ffd5dc;
  outline-offset: 2px;
}

.rosa {
  background: #ffd5dc;
  color: #a30c29;
}

.rosa-claro { background: #ffebee; }
.vino { color: #a30c29; }

.numero {
  position: absolute;
  bottom: 6%;
  left: 8%;
  font-size: clamp(17px, 4.5vw, 42px);
  font-weight: 800;
  line-height: 1;
  z-index: 3;
}

/* ILUSTRACIONES */

.dibujo {
  position: absolute;
  pointer-events: none;
  z-index: 1;
}

.dibujo svg {
  width: 100%;
  height: 100%;
  display: block;
}

.dibujo-guirnalda {
  top: 6%;
  left: 8%;
  width: 84%;
  height: 55%;
}

.dibujo-baston {
  top: 10%;
  right: 8%;
  width: 43%;
  height: 78%;
}

.dibujo-pino {
  top: 12%;
  left: 13%;
  width: 74%;
  height: 65%;
}

.dibujo-estrellas {
  top: 12%;
  right: 12%;
  width: 42%;
  height: 70%;
}

.dibujo-esfera {
  top: 4%;
  left: 12%;
  width: 76%;
  height: 66%;
}

.dibujo-regalos {
  top: 10%;
  right: 7%;
  width: 48%;
  height: 75%;
}

.dibujo-mono {
  top: 8%;
  right: 8%;
  width: 53%;
  height: 80%;
}

/* REGALO DEL DIA 24 */

.regalo {
  background: #ed203c;
  color: white;
}

.regalo::after {
  border-color: #ff9ba8;
}

.regalo .numero {
  font-size: clamp(38px, 11vw, 88px);
  bottom: 6%;
  left: 8%;
}

.cinta-vertical {
  position: absolute;
  width: 12%;
  height: 100%;
  top: 0;
  left: 44%;
  background: #ffd5dc;
}

.cinta-horizontal {
  position: absolute;
  width: 100%;
  height: 12%;
  top: 44%;
  left: 0;
  background: #ffd5dc;
}

.lazo {
  position: absolute;
  width: 70%;
  height: 32%;
  top: 1%;
  left: 15%;
}

.hoy {
  position: absolute;
  top: 6%;
  right: 6%;
  background: white;
  color: #d71938;
  padding: 3px 6px;
  border-radius: 20px;
  font-size: clamp(8px, 1.4vw, 12px);
  z-index: 4;
}

/* VENTANAS DE SORPRESAS */

dialog {
  width: min(92vw, 500px);
  max-height: 85vh;
  max-height: 85dvh;
  overflow: auto;
  border: none;
  border-radius: 20px;
  padding: 28px;
  background: #fff5f6;
  color: #a6112b;
  box-shadow: 0 15px 40px #0005;
  animation: aparecer .25s ease;
}

dialog::backdrop {
  background: #36000c99;
}

dialog h2 {
  font-size: 30px;
  margin-top: 0;
}

#contenidoModal {
  font-size: 18px;
  line-height: 1.6;
  white-space: pre-line;
}

dialog img,
dialog video {
  max-width: 100%;
  border-radius: 12px;
}

.boton {
  border: none;
  border-radius: 9px;
  padding: 12px 18px;
  background: #ffd5dc;
  color: #a6112b;
  font-family: inherit;
  font-weight: bold;
  cursor: pointer;
  margin-top: 15px;
}

.cerrar {
  background: #ce1938;
  color: white;
}

footer {
  padding: 20px 15px 40px;
}

/* REGALOS INDEPENDIENTES */

#modal.regalo-independiente {
  width: min(95vw, 570px);
  padding: 16px 12px;
}

#modal.regalo-independiente #tituloModal {
  font-family: Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin: 8px 0;
}

.marco-regalo {
  display: block;
  width: 100%;
  height: 65vh;
  border: none;
  border-radius: 12px;
}

@keyframes aparecer {
  from {
    opacity: 0;
    transform: scale(.92);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* ANIMACIONES DE LAS PUERTAS */

.puerta.abriendo {
  overflow: hidden;
  background: #940d2b;
  transform: none;
  box-shadow: inset 0 3px 12px #52001c88;
}

.puerta.abriendo::after {
  opacity: 0;
}

.cara-animada {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  z-index: 3;
  pointer-events: none;
}

.cara-animada::after {
  content: "";
  position: absolute;
  inset: clamp(3px, .7vw, 6px);
  border: 1.5px dashed #e58b99;
  border-radius: 5px;
  pointer-events: none;
}

.regalo .cara-animada::after {
  border-color: #ff9ba8;
}

.interior-animado {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffd5dc;
  font-size: clamp(25px, 6vw, 65px);
  pointer-events: none;
}

.confeti-navidad {
  position: fixed;
  width: 8px;
  height: 12px;
  pointer-events: none;
  z-index: 999;
  border-radius: 2px;
}

/* PANTALLA DE BIENVENIDA */

#bienvenida {
  position: fixed;
  inset: 0;
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  max-width: none;
  max-height: none;
  border-radius: 0;
  border: none;
  background: #cf1735;
  color: #fff5f3;
  overflow: auto;
  box-shadow: none;
  animation: none;
}

#bienvenida::backdrop {
  background: #cf1735;
}

#bienvenida:not([open]) {
  display: none;
}

.bienvenida-centro {
  position: relative;
  min-height: 100%;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 28px 18px;
  gap: 14px;
  isolation: isolate;
}

.bienvenida-fecha {
  font-size: 12px;
  letter-spacing: 3px;
  color: #ffd5dc;
  margin: 0;
}

#bienvenida h2 {
  font-size: clamp(30px, 6vw, 54px);
  line-height: 1.1;
  margin: 0;
  color: #fff5f3;
}

.bienvenida-sub {
  font-size: clamp(14px, 3.3vw, 18px);
  color: #fff0f2;
  margin: 0;
}

.regalo-gigante {
  appearance: none;
  display: block;
  width: min(74vw, 360px, 48vh);
  min-width: 135px;
  padding: 0;
  margin: 8px 0 0;
  border: none;
  background: none;
  cursor: pointer;
  position: relative;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.regalo-gigante:focus-visible {
  outline: 2px dashed #fff5f3;
  outline-offset: 6px;
  border-radius: 15px;
}

.regalo-gigante svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}

.regalo-gigante:not(:disabled) {
  animation: flotarRegalo 3.5s ease-in-out infinite;
}

.regalo-gigante:not(:disabled):hover {
  filter: brightness(1.045);
}

.regalo-gigante:disabled {
  cursor: default;
}

.tapa-gigante {
  transform-box: fill-box;
  transform-origin: center bottom;
}

.instruccion-bienvenida {
  font-family: Arial, sans-serif;
  font-size: 13px;
  letter-spacing: .05em;
  margin: 5px 0 0;
  color: #fff5f3;
}

.adorno-bienvenida {
  position: absolute;
  color: #ffd5dc;
  font-size: clamp(16px, 4vw, 27px);
  opacity: .7;
  pointer-events: none;
  z-index: -1;
}

.particula-bienvenida {
  position: fixed;
  pointer-events: none;
  z-index: 100;
  display: block;
  font-family: Arial, sans-serif;
  line-height: 1;
  will-change: transform, opacity;
  opacity: 0;
}

@keyframes flotarRegalo {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-7px);
  }
}

@media (max-height: 500px) and (orientation: landscape) {
  .bienvenida-centro {
    gap: 6px;
    padding: 16px;
  }

  .regalo-gigante {
    width: min(36vh, 220px);
    min-width: 110px;
    margin: 0;
  }

  #bienvenida h2 {
    font-size: 28px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .puerta { transition: none; }
  dialog { animation: none; }
  .puerta:hover { transform: none; }
  .regalo-gigante:not(:disabled) { animation: none; }
}

</style>
</head>

<body>

<script>

/* CONFIGURACION GENERAL */

let modoPrueba = false;
let animandoPuerta = false;

const calendario = document.getElementById("calendario");
const modal = document.getElementById("modal");
const botonPrueba = document.getElementById("modoPruebaBtn");

const tituloModal = document.getElementById("tituloModal");
const contenidoModal = document.getElementById("contenidoModal");

const rosas = [15, 20, 3, 12];
const rosasClaros = [7, 13, 18, 16, 19, 6];
const vinos = [15, 20, 22, 23, 3, 12];

/* REGALOS TERMINADOS */

/* Aqui agregaremos los dias que vayamos programando */

const regalosProgramados = [1, 4, 5, 8, 10, 11, 17];

let observadorRegalo = null;

/* ILUSTRACIONES NAVIDEÑAS */

const dibujos = {

  1: `

  9: `

  11: `

/* DIRECCIONES DE APERTURA */

const direcciones = {

  1: "arriba",
  2: "derecha",
  3: "abajo",
  4: "izquierda",

  6: "derecha",

  derecha: "translateX(105%)",
  arriba: "translateY(-105%)",

};

/* DESBLOQUEO POR FECHA */

function disponible(dia) {

  return modoPrueba ||
    new Date() >= new Date(2026, 11, dia);

}

function esHoy(dia) {

  const hoy = new Date();

  return hoy.getFullYear() === 2026 &&
    hoy.getMonth() === 11 &&
    hoy.getDate() === dia;

}

/* ABRIR REGALOS INDEPENDIENTES */

function mostrarSorpresa(dia) {

  tituloModal.textContent = dia + " de diciembre";

  contenidoModal.replaceChildren();

  modal.classList.remove("regalo-independiente");

  if (!disponible(dia)) {

    contenidoModal.textContent =
      "Esta sorpresa se desbloqueará el " +
      dia + " de diciembre. ♡";

  } else if (regalosProgramados.includes(dia)) {

    modal.classList.add("regalo-independiente");

    const marco = document.createElement("iframe");

    marco.className = "marco-regalo";

    marco.title = "Regalo del día " + dia;

    marco.addEventListener("load", () => {

      try {

        const regalo =
          marco.contentDocument.getElementById("regalo");

        if (!regalo) return;

        function ajustarAltura() {

          marco.style.height =
            Math.ceil(regalo.getBoundingClientRect().height)
            + 6 + "px";

        }

        ajustarAltura();

        if (typeof ResizeObserver !== "undefined") {

          observadorRegalo = new ResizeObserver(ajustarAltura);

          observadorRegalo.observe(regalo);

        }

      } catch (error) {

        marco.style.height = "65vh";

      }

    });

    marco.src =
      "regalos/dia" +
      String(dia).padStart(2, "0") +
      ".html";

    contenidoModal.appendChild(marco);

  } else {

    contenidoModal.textContent =
      "Aquí agregaremos una sorpresa especial. ♡";

  }

  modal.showModal();
  modal.scrollTop = 0;

}

/* LIMPIAR REGALO AL CERRAR */

modal.addEventListener("close", () => {

  if (observadorRegalo) {

    observadorRegalo.disconnect();
    observadorRegalo = null;

  }

  contenidoModal.replaceChildren();

  modal.classList.remove("regalo-independiente");

});

/* TEMBLOR DE PUERTAS BLOQUEADAS */

function temblar(puerta) {

  return puerta.animate([

    { transform: "translateX(0)" },
    { transform: "translateX(-6px) rotate(-4deg)" },
    { transform: "translateX(6px) rotate(4deg)" },
    { transform: "translateX(-5px) rotate(-3deg)" },
    { transform: "translateX(5px) rotate(3deg)" },
    { transform: "translateX(-3px)" },
    { transform: "translateX(3px)" },
    { transform: "translateX(0)" }

  ], {

    duration: 480,
    easing: "ease-in-out"

  }).finished;

}

/* CONFETI DEL DIA 24 */

function lanzarConfeti(puerta) {

  const posicion = puerta.getBoundingClientRect();

  const centroX = posicion.left + posicion.width / 2;
  const centroY = posicion.top + posicion.height / 2;

  const colores = [
    "#ffffff",
    "#ffd5dc",
    "#ff647d",
    "#ed203c",
    "#ffebee"
  ];

  const animaciones = [];

  for (let i = 0; i < 50; i++) {

    const confeti = document.createElement("span");

    confeti.className = "confeti-navidad";
    confeti.style.left = centroX + "px";
    confeti.style.top = centroY + "px";

    confeti.style.background =
      colores[i % colores.length];

    document.body.appendChild(confeti);

    const angulo = Math.random() * Math.PI * 2;
    const distancia = 60 + Math.random() * 170;

    const x = Math.cos(angulo) * distancia;
    const y = Math.sin(angulo) * distancia;

    const animacion = confeti.animate([

      {
        transform: "translate(0,0) rotate(0deg)",
        opacity: 1
      },

      {
        transform:
          `translate(${x}px, ${y}px)
          rotate(${360 + i * 20}deg)`,

        opacity: 0
      }

    ], {

      duration: 750 + Math.random() * 350,
      easing: "ease-out",
      fill: "forwards"

    });

    animaciones.push(

      animacion.finished
        .catch(() => {})
        .finally(() => confeti.remove())

    );

  }

  return Promise.all(animaciones);

}

/* APERTURA DE LAS PUERTAS */

async function abrirPuerta(dia) {

  if (animandoPuerta || modal.open) return;

  const puerta =
    calendario.querySelector(`[data-dia="${dia}"]`);

  if (!puerta || puerta.disabled) return;

  const reducirMovimiento = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  if (reducirMovimiento || !puerta.animate) {

    mostrarSorpresa(dia);
    return;

  }

  animandoPuerta = true;
  botonPrueba.disabled = true;

  let originales = null;

  function restaurarPuerta() {

    if (originales) {

      puerta.replaceChildren(...originales);
      puerta.classList.remove("abriendo");
      originales = null;

    }

    botonPrueba.disabled = false;

  }

  try {

    if (!disponible(dia)) {

      await temblar(puerta);
      mostrarSorpresa(dia);
      return;

    }

    const estilo = getComputedStyle(puerta);

    const colorFondo = estilo.backgroundColor;
    const colorTexto = estilo.color;

    originales = Array.from(puerta.childNodes);

    const cara = document.createElement("div");

    cara.className = "cara-animada";
    cara.style.backgroundColor = colorFondo;
    cara.style.color = colorTexto;

    originales.forEach(elemento => {
      cara.appendChild(elemento);
    });

    const interior = document.createElement("div");

    interior.className = "interior-animado";
    interior.textContent = "♡";

    puerta.appendChild(interior);
    puerta.appendChild(cara);
    puerta.classList.add("abriendo");

    if (dia === 24) {

      const caraDerecha = cara.cloneNode(true);

      cara.style.clipPath = "inset(0 50% 0 0)";
      caraDerecha.style.clipPath = "inset(0 0 0 50%)";

      puerta.appendChild(caraDerecha);

      await Promise.all([

        cara.animate([
          { transform: "translateX(0)" },
          { transform: "translateX(-105%)" }
        ], {
          duration: 800,
          easing: "cubic-bezier(.3,.7,.2,1)",
          fill: "forwards"
        }).finished,

        caraDerecha.animate([
          { transform: "translateX(0)" },
          { transform: "translateX(105%)" }
        ], {
          duration: 800,
          easing: "cubic-bezier(.3,.7,.2,1)",
          fill: "forwards"
        }).finished

      ]);

      interior.animate([
        { transform: "scale(.4)", opacity: 0 },
        { transform: "scale(1.3)", opacity: 1 },
        { transform: "scale(1)", opacity: 1 }
      ], {
        duration: 650,
        easing: "ease-out"
      });

      await lanzarConfeti(puerta);

    } else {

      const movimiento =
        desplazamientos[direcciones[dia]];

      await cara.animate([

        { transform: "translate(0,0)" },
        { transform: movimiento }

      ], {

        duration: 650,
        easing: "cubic-bezier(.3,.7,.2,1)",
        fill: "forwards"

      }).finished;

    }

    modal.addEventListener(
      "close",
      restaurarPuerta,
      { once: true }
    );

    mostrarSorpresa(dia);

  } catch (error) {

    restaurarPuerta();

    if (!modal.open) {
      mostrarSorpresa(dia);
    }

  } finally {

    animandoPuerta = false;

    if (!originales) {
      botonPrueba.disabled = false;
    }

  }

}

/* CREAR CALENDARIO */

function renderizarCalendario() {

  calendario.innerHTML = "";

  for (let dia = 1; dia <= 24; dia++) {

    const puerta = document.createElement("button");

    puerta.className = "puerta";
    puerta.dataset.dia = dia;
    puerta.style.gridArea = "d" + dia;

    puerta.setAttribute(
      "aria-label",
      "Día " + dia +
      (disponible(dia)
        ? ", disponible"
        : ", bloqueado")
    );

    if (rosas.includes(dia)) {
      puerta.classList.add("rosa");
    }

    if (rosasClaros.includes(dia)) {
      puerta.classList.add("rosa-claro");
    }

    if (vinos.includes(dia)) {
      puerta.classList.add("vino");
    }

    if (dia === 24) {

      puerta.classList.add("regalo");

      puerta.innerHTML = `

        <div class="cinta-vertical"></div>
        <div class="cinta-horizontal"></div>

        <svg class="lazo" viewBox="0 0 120 50">
          <path d="M60 38
            C5 42 -3 0 28 6
            C43 7 53 22 60 38
            C67 22 77 7 92 6
            C123 0 115 42 60 38"
            fill="none"
            stroke="#ffd5dc"
            stroke-width="7"
            stroke-linecap="round"/>
        </svg>

        <span class="numero">24</span>

      `;

    } else {

      puerta.innerHTML = `

        ${dibujos[dia] || ""}
        <span class="numero">${dia}</span>

      `;

    }

    if (esHoy(dia)) {

      puerta.innerHTML +=
        '<span class="hoy">Hoy</span>';

    }

    puerta.onclick = () => abrirPuerta(dia);

    calendario.appendChild(puerta);

  }

}

/* MODO DE PRUEBA */

botonPrueba.onclick = function() {

  if (animandoPuerta || modal.open) return;

  modoPrueba = !modoPrueba;

  this.textContent = modoPrueba
    ? "Desactivar modo de prueba"
    : "Activar modo de prueba";

  renderizarCalendario();

};

renderizarCalendario();

/* PANTALLA DE BIENVENIDA */

const bienvenida =
  document.getElementById("bienvenida");

const regaloGigante =
  document.getElementById("regaloGigante");

const tapaGigante =
  document.getElementById("tapaGigante");

const mensajeBienvenida =
  document.getElementById("mensajeBienvenida");

let bienvenidaAbierta = false;

function pausa(ms) {

  return new Promise(
    resolver => setTimeout(resolver, ms)
  );

}

function animarElemento(elemento, pasos, opciones) {

  return elemento.animate(
    pasos,
    opciones
  ).finished.catch(() => {});

}

/* EXPLOSION MASIVA DE CORAZONES Y CONFETI */

function confetiBienvenida() {

  const rect = regaloGigante.getBoundingClientRect();

  const centroX = rect.left + rect.width / 2;
  const centroY = rect.top + rect.height * .39;

  const colores = [

    "#ffffff",
    "#fff5f3",
    "#ffd5dc",
    "#ffabc0",
    "#ff8298",
    "#ff4567",
    "#ed203c",
    "#a30c29",
    "#ffe4e9"

  ];

  const animaciones = [];
  const cantidad = 260;

  for (let i = 0; i < cantidad; i++) {

    const particula = document.createElement("span");

    particula.className = "particula-bienvenida";
    particula.setAttribute("aria-hidden", "true");

    const tipo = Math.random();

    const esCorazon = tipo < .55;
    const esEstrella = tipo >= .55 && tipo < .67;

    if (esCorazon) {

      particula.textContent =
        Math.random() > .35 ? "♥" : "♡";

    } else if (esEstrella) {

      particula.textContent = "✦";

    }

    const tamano = esCorazon
      ? 12 + Math.random() * 26
      : 6 + Math.random() * 13;

    const color =
      colores[Math.floor(Math.random() * colores.length)];

    particula.style.left = centroX + "px";
    particula.style.top = centroY + "px";
    particula.style.fontSize = tamano + "px";
    particula.style.color = color;

    if (!particula.textContent) {

      particula.style.width = tamano * .65 + "px";
      particula.style.height = tamano + "px";
      particula.style.background = color;

      particula.style.borderRadius =
        Math.random() > .5 ? "50%" : "2px";

    }

    bienvenida.appendChild(particula);

    const angulo = Math.random() * Math.PI * 2;
    const distancia = .25 + Math.random() * .85;

    const dx =
      Math.cos(angulo) * innerWidth * .65 * distancia;

    const dy =
      Math.sin(angulo) * innerHeight * .75 * distancia;

    const giro = (Math.random() - .5) * 900;
    const retraso = Math.random() * 380;
    const duracion = 1400 + Math.random() * 800;

    animaciones.push(

      animarElemento(particula, [

        {
          transform:
            "translate(-50%,-50%) scale(.1)",
          opacity: 0
        },

        {
          transform:
            `translate(${dx * .18}px,
            ${dy * .18 - 35}px)
            rotate(${giro * .12}deg)
            scale(1.15)`,

          opacity: 1,
          offset: .12
        },

        {
          transform:
            `translate(${dx * .82}px,
            ${dy * .85 - 90}px)
            rotate(${giro * .65}deg)
            scale(1)`,

          opacity: 1,
          offset: .58
        },

        {
          transform:
            `translate(${dx}px,
            ${dy + innerHeight * .45}px)
            rotate(${giro}deg)
            scale(.85)`,

          opacity: 0
        }

      ], {

        duration: duracion,
        delay: retraso,
        easing: "cubic-bezier(.12,.55,.35,1)",
        fill: "forwards"

      }).finally(() => particula.remove())

    );

  }

  return Promise.all(animaciones);

}

/* APERTURA DEL REGALO GIGANTE */

async function abrirBienvenida() {

  if (bienvenidaAbierta) return;

  bienvenidaAbierta = true;
  regaloGigante.disabled = true;

  mensajeBienvenida.textContent =
    "¡Bienvenida a nuestros 24 días!";

  const reducirMovimiento =
    window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;

  try {

    if (reducirMovimiento || !regaloGigante.animate) {

      await pausa(180);
      return;

    }

    await animarElemento(regaloGigante, [

      { transform: "scale(1) rotate(0deg)" },
      { transform: "scale(.94) rotate(-3deg)" },
      { transform: "scale(.98) rotate(3deg)" },
      { transform: "scale(1.025) rotate(0deg)" }

    ], {

      duration: 240,
      fill: "forwards"

    });

    await Promise.all([

      animarElemento(tapaGigante, [

        {
          transform: "translate(0,0) rotate(0deg)",
          opacity: 1
        },

        {
          transform:
            "translate(-10px,-90px) rotate(-10deg)",
          opacity: 1,
          offset: .45
        },

        {
          transform:
            "translate(-35px,-190px) rotate(-25deg)",
          opacity: 0
        }

      ], {

        duration: 800,
        easing: "cubic-bezier(.2,.7,.2,1)",
        fill: "forwards"

      }),

      confetiBienvenida()

    ]);

    await animarElemento(bienvenida, [

      { opacity: 1 },
      { opacity: 0 }

    ], {

      duration: 350,
      fill: "forwards"

    });

  } catch (error) {

    console.warn("Error de animación", error);

  } finally {

    bienvenida.close();
    bienvenida.remove();

    window.scrollTo(0, 0);

    const primeraPuerta =
      calendario.querySelector(".puerta:not(:disabled)");

    if (primeraPuerta) {

      primeraPuerta.focus({
        preventScroll: true
      });

    }

  }

}

regaloGigante.addEventListener(
  "click",
  abrirBienvenida
);

bienvenida.addEventListener("cancel", evento => {

  evento.preventDefault();

  if (!bienvenidaAbierta) {
    abrirBienvenida();
  }

});

bienvenida.showModal();

</script>
