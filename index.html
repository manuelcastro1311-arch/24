<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>24 días contigo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #cf1735;
      color: #fff3f3;
      text-align: center;
      min-height: 100vh;
    }

    header {
      padding: 28px 16px 14px;
    }

    .mini {
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 62px);
      line-height: 1;
    }

    .sub {
      margin-top: 10px;
      font-size: 17px;
    }

    .adorno {
      margin-top: 10px;
      font-size: 18px;
      letter-spacing: 4px;
    }

    .contenedor {
      width: min(92vw, 650px);
      margin: 18px auto 0;
    }

    .calendario {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #d91d3b;
      border: 8px solid #ef2647;
      border-radius: 22px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: 8px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08);
    }

    .puerta {
      position: relative;
      border-radius: 14px;
      border: 2px solid rgba(255,255,255,0.85);
      background: #f6f6f6;
      color: #d3203e;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .puerta:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
    }

    .puerta::after {
      content: "";
      position: absolute;
      inset: 6px;
      border: 2px dashed rgba(211, 32, 62, 0.35);
      border-radius: 10px;
      pointer-events: none;
    }

    .blanco {
      background: #f4f4f4;
      color: #e21f42;
    }

    .rosa {
      background: #efd8dd;
      color: #b51c36;
    }

    .rojo {
      background: #ef1f43;
      color: #ffffff;
    }

    .numero {
      position: absolute;
      left: 10px;
      bottom: 6px;
      font-size: clamp(19px, 3vw, 28px);
      font-weight: bold;
      z-index: 2;
    }

    .estado {
      position: absolute;
      right: 8px;
      bottom: 7px;
      z-index: 2;
      font-size: 12px;
      background: rgba(255,255,255,0.85);
      color: #b71f38;
      padding: 2px 7px;
      border-radius: 999px;
    }

    .iconito {
      position: absolute;
      left: 10px;
      top: 8px;
      font-size: clamp(15px, 2vw, 21px);
      z-index: 2;
      opacity: 0.95;
    }

    .puerta24 .numero {
      font-size: clamp(48px, 8vw, 74px);
      left: 14px;
      bottom: 10px;
      line-height: 1;
    }

    .puerta24 .estado {
      bottom: 10px;
      right: 10px;
    }

    .cinta-v {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 12px;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.82);
      z-index: 1;
    }

    .cinta-h {
      position: absolute;
      left: 0;
      right: 0;
      top: 42%;
      height: 12px;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.82);
      z-index: 1;
    }

    .lazo1,
    .lazo2 {
      position: absolute;
      top: 12px;
      width: 52px;
      height: 30px;
      border: 6px solid rgba(255,255,255,0.85);
      border-radius: 999px;
      z-index: 1;
    }

    .lazo1 {
      left: 50%;
      transform: translateX(-92%);
    }

    .lazo2 {
      left: 50%;
      transform: translateX(-8%);
    }

    dialog {
      width: min(92vw, 520px);
      border: none;
      border-radius: 18px;
      padding: 24px;
      background: #fff7f7;
      color: #8d1029;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    dialog::backdrop {
      background: rgba(0,0,0,0.55);
    }

    #tituloModal {
      margin-top: 0;
      font-size: 30px;
    }

    #contenidoModal {
      font-size: 18px;
      line-height: 1.5;
      white-space: pre-line;
    }

    .cerrar {
      margin-top: 18px;
      border: none;
      padding: 11px 18px;
      border-radius: 10px;
      background: #c71f37;
      color: white;
      cursor: pointer;
      font-family: inherit;
    }

    footer {
      padding: 24px 16px 42px;
    }

    .btn {
      margin-top: 12px;
      border: none;
      background: #f8e3e6;
      color: #b21b35;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-family: inherit;
    }

    @media (max-width: 520px) {
      .contenedor {
        width: min(96vw, 650px);
      }

      .calendario {
        gap: 6px;
        padding: 8px;
      }

      .numero {
        left: 8px;
        bottom: 5px;
        font-size: 18px;
      }

      .puerta24 .numero {
        font-size: 42px;
      }

      .lazo1,
      .lazo2 {
        width: 42px;
        height: 24px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="mini">✦ DICIEMBRE 2026 ✦</div>
    <h1>24 días contigo</h1>
    <div class="sub">Una pequeña sorpresa para cada día.</div>
    <div class="adorno">♡ ─ ✧ ─ ♡</div>
  </header>

  <div class="contenedor">
    <main class="calendario" id="calendario"></main>
  </div>

  <dialog id="modal">
    <h2 id="tituloModal"></h2>
    <div id="contenidoModal"></div>
    <button class="cerrar" onclick="document.getElementById('modal').close()">Cerrar</button>
  </dialog>

  <footer>
    <div>Hecho especialmente para ti ♡</div>
    <button class="btn" id="modoPruebaBtn">Activar modo de prueba</button>
  </footer>

  <script>
    let modoPrueba = false;

    const sorpresas = {
      1: "Bienvenido a nuestro calendario.\nAquí empezará todo lo bonito.",
      2: "Aquí pondremos una sorpresa especial.",
      3: "Aquí podremos poner una carta cortita.",
      4: "Aquí irá una foto o un recuerdo.",
      5: "Aquí irá otra sorpresa bonita.",
      6: "Aquí puede ir un mensajito romántico.",
      7: "Aquí puede ir una canción.",
      8: "Aquí puede ir una anécdota.",
      9: "Aquí puede ir un mini quiz.",
      10: "Aquí puede ir una promesa.",
      11: "Aquí puede ir otro recuerdo.",
      12: "Aquí puede ir una carta.",
      13: "Aquí puede ir una foto.",
      14: "Aquí puede ir una nota de voz.",
      15: "Aquí puede ir una sorpresa divertida.",
      16: "Aquí puede ir otro detalle.",
      17: "Aquí puede ir una dedicatoria.",
      18: "Aquí puede ir un video.",
      19: "Aquí puede ir una razón por la que la quieres.",
      20: "Aquí puede ir una pregunta bonita.",
      21: "Aquí puede ir un vale o premio.",
      22: "Aquí puede ir una sorpresa secreta.",
      23: "Aquí puede ir un mensaje especial.",
      24: "¡Feliz Navidad!\nAquí irá la sorpresa final más importante. ♡"
    };

    const puertas = [
      { dia: 7,  clase: "blanco", col: 1, row: 1, w: 1, h: 1, icono: "" },
      { dia: 15, clase: "rosa",   col: 2, row: 1, w: 1, h: 1, icono: "" },
      { dia: 1,  clase: "blanco", col: 3, row: 1, w: 2, h: 1, icono: "" },
      { dia: 22, clase: "blanco", col: 5, row: 1, w: 1, h: 1, icono: "" },
      { dia: 10, clase: "blanco", col: 6, row: 1, w: 1, h: 1, icono: "" },

      { dia: 24, clase: "rojo puerta24", col: 1, row: 2, w: 2, h: 2, icono: "" },
      { dia: 4,  clase: "blanco", col: 3, row: 2, w: 1, h: 1, icono: "" },
      { dia: 9,  clase: "blanco", col: 5, row: 2, w: 2, h: 1, icono: "" },

      { dia: 20, clase: "rosa",   col: 3, row: 3, w: 1, h: 1, icono: "" },
      { dia: 13, clase: "rosa",   col: 4, row: 2, w: 1, h: 2, icono: "" },
      { dia: 18, clase: "rosa",   col: 5, row: 3, w: 1, h: 1, icono: "" },
      { dia: 2,  clase: "blanco", col: 6, row: 3, w: 1, h: 1, icono: "" },

      { dia: 5,  clase: "blanco", col: 1, row: 4, w: 1, h: 1, icono: "" },
      { dia: 16, clase: "rosa",   col: 2, row: 4, w: 1, h: 1, icono: "" },
      { dia: 11, clase: "blanco", col: 3, row: 4, w: 2, h: 1, icono: "" },
      { dia: 23, clase: "blanco", col: 6, row: 4, w: 1, h: 1, icono: "" },

      { dia: 19, clase: "blanco", col: 1, row: 5, w: 1, h: 2, icono: "" },
      { dia: 8,  clase: "blanco", col: 2, row: 5, w: 1, h: 1, icono: "" },
      { dia: 14, clase: "blanco", col: 3, row: 5, w: 1, h: 1, icono: "" },
      { dia: 12, clase: "rosa",   col: 4, row: 5, w: 1, h: 1, icono: "" },
      { dia: 3,  clase: "rosa",   col: 5, row: 4, w: 1, h: 2, icono: "" },

      { dia: 17, clase: "blanco", col: 2, row: 6, w: 2, h: 1, icono: "" },
      { dia: 6,  clase: "rosa",   col: 4, row: 6, w: 2, h: 1, icono: "" },
      { dia: 21, clase: "blanco", col: 6, row: 5, w: 1, h: 2, icono: "" }
    ];

    function disponible(dia) {
      return modoPrueba || new Date() >= new Date(2026, 11, dia);
    }

    function abrirPuerta(dia) {
      const titulo = document.getElementById("tituloModal");
      const contenido = document.getElementById("contenidoModal");

      titulo.textContent = `Día ${dia}`;

      if (!disponible(dia)) {
        contenido.textContent = `Esta sorpresa se desbloqueará el ${dia} de diciembre.`;
      } else {
        contenido.textContent = sorpresas[dia] || "Aquí agregaremos una sorpresa especial.";
      }

      document.getElementById("modal").showModal();
    }

    function crearPuerta(p) {
      const btn = document.createElement("button");
      btn.className = `puerta ${p.clase}`;
      btn.style.gridColumn = `${p.col} / span ${p.w}`;
      btn.style.gridRow = `${p.row} / span ${p.h}`;

      if (p.dia === 24) {
        btn.innerHTML = `
          <div class="cinta-v"></div>
          <div class="cinta-h"></div>
          <div class="lazo1"></div>
          <div class="lazo2"></div>
          <div class="numero">24</div>
          <div class="estado">${disponible(p.dia) ? "♡" : "🔒"}</div>
        `;
      } else {
        btn.innerHTML = `
          <div class="numero">${p.dia}</div>
          <div class="estado">${disponible(p.dia) ? "♡" : "🔒"}</div>
        `;
      }

      btn.addEventListener("click", () => abrirPuerta(p.dia));
      return btn;
    }

    function renderizarCalendario() {
      const calendario = document.getElementById("calendario");
      calendario.innerHTML = "";

      puertas.forEach(p => {
        calendario.appendChild(crearPuerta(p));
      });
    }

    document.getElementById("modoPruebaBtn").addEventListener("click", function () {
      modoPrueba = !modoPrueba;
      this.textContent = modoPrueba
        ? "Desactivar modo de prueba"
        : "Activar modo de prueba";
      renderizarCalendario();
    });

    renderizarCalendario();
  </script>
</body>
</html>
