<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24 días contigo</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(180deg, #cd1937, #af0b2b);
  color: #fff1f3;
  font-family: Georgia, serif;
  text-align: center;
}

header {
  padding: 30px 15px 20px;
}

.fecha {
  font-size: 13px;
  letter-spacing: 2px;
}

h1 {
  font-size: clamp(32px, 7vw, 60px);
  margin: 12px 0;
}

.subtitulo {
  font-size: 16px;
  margin: 8px 0;
}

.decoracion {
  margin-top: 14px;
  letter-spacing: 5px;
}

/* TABLERO CUADRADO */

.contenedor {
  width: min(94vw, 650px);
  margin: 15px auto;
  padding: clamp(7px, 1.8vw, 12px);
  background: #ed203c;
  border-radius: 24px;
}

.calendario {
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #b90e29;
  border-radius: 16px;
  padding: clamp(6px, 1.5vw, 10px);

  display: grid;

  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-template-rows: repeat(6, minmax(0, 1fr));

  gap: clamp(5px, 1.2vw, 10px);

  grid-template-areas:
    "d7  d15 d1  d1  d22 d10"
    "d24 d24 d4  d13 d9  d9"
    "d24 d24 d20 d13 d18 d2"
    "d5  d16 d11 d11 d3  d23"
    "d19 d8  d14 d12 d3  d21"
    "d19 d17 d17 d6  d6  d21";
}

/* DISEÑO DE LAS PUERTAS */

.puerta {
  position: relative;
  min-width: 0;
  min-height: 0;
  padding: 0;
  border: none;
  border-radius: clamp(6px, 1.5vw, 12px);
  background: #fffbfb;
  color: #e71e3e;
  cursor: pointer;
  overflow: hidden;
  font-family: Arial, sans-serif;
  transition: transform .2s, box-shadow .2s;
  box-shadow: 0 3px 5px #77001944;
}

.puerta::after {
  content: "";
  position: absolute;
  inset: clamp(3px, .7vw, 6px);
  border: 1.5px dashed #e58b99;
  border-radius: 5px;
  pointer-events: none;
}

.puerta:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 10px #76001866;
  z-index: 5;
}

.puerta:focus-visible {
  outline: 3px solid #ffd9df;
  outline-offset: 2px;
}

.rosa {
  background: #ffdade;
  color: #a6112b;
}

.rosa-claro {
  background: #ffeff1;
}

.numero {
  position: absolute;
  bottom: 5%;
  left: 8%;
  font-size: clamp(17px, 4.5vw, 42px);
  font-weight: 800;
  line-height: 1;
  z-index: 3;
}

/* PUERTA ESPECIAL DEL DÍA 24 */

.regalo {
  background: #eb203c;
  color: #ffffff;
}

.regalo::after {
  border-color: #ff9ba8;
}

.regalo .numero {
  font-size: clamp(38px, 11vw, 88px);
  bottom: 6%;
  left: 8%;
}

.cinta-vertical {
  position: absolute;
  width: 12%;
  height: 100%;
  top: 0;
  left: 44%;
  background: #ffd9df;
}

.cinta-horizontal {
  position: absolute;
  width: 100%;
  height: 12%;
  top: 44%;
  left: 0;
  background: #ffd9df;
}

.lazo {
  position: absolute;
  width: 70%;
  height: 32%;
  top: 1%;
  left: 15%;
}

.hoy {
  position: absolute;
  right: 5%;
  top: 5%;
  background: white;
  color: #d71938;
  padding: 3px 6px;
  border-radius: 20px;
  font-size: clamp(8px, 1.4vw, 12px);
  z-index: 4;
}

/* VENTANA DE LAS SORPRESAS */

dialog {
  width: min(90vw, 500px);
  max-height: 85vh;
  overflow: auto;
  border: none;
  border-radius: 20px;
  padding: 28px;
  background: #fff5f6;
  color: #a6112b;
  box-shadow: 0 15px 40px #0005;
  animation: aparecer .25s ease;
}

dialog::backdrop {
  background: #36000c99;
}

dialog h2 {
  font-size: 30px;
  margin-top: 0;
}

#contenidoModal {
  font-size: 18px;
  line-height: 1.6;
  white-space: pre-line;
}

dialog img,
dialog video {
  max-width: 100%;
  border-radius: 12px;
}

.boton {
  border: none;
  border-radius: 9px;
  padding: 12px 18px;
  background: #ffd9df;
  color: #a6112b;
  font-family: inherit;
  font-weight: bold;
  cursor: pointer;
  margin-top: 15px;
}

.cerrar {
  background: #ce1938;
  color: white;
}

footer {
  padding: 20px 15px 40px;
}

@keyframes aparecer {
  from {
    opacity: 0;
    transform: scale(.92);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

</style>
</head>

<body>

<header>
  <div class="fecha">✦ DICIEMBRE 2026 ✦</div>
  <h1>24 días contigo</h1>

  <p class="subtitulo">
    Una pequeña sorpresa para cada día.
  </p>

  <div class="decoracion">♡ ─ ✧ ─ ♡</div>
</header>

<div class="contenedor">
  <main class="calendario" id="calendario"></main>
</div>

<dialog id="modal">

  <h2 id="tituloModal"></h2>

  <div id="contenidoModal"></div>

  <button class="boton cerrar"
    onclick="document.getElementById('modal').close()">
    Cerrar
  </button>

</dialog>

<footer>

  <p>Hecho especialmente para ti ♡</p>

  <button class="boton" id="modoPruebaBtn">
    Activar modo de prueba
  </button>

</footer>

<script>

let modoPrueba = false;

const calendario = document.getElementById("calendario");
const modal = document.getElementById("modal");

/* CONTENIDO PROVISIONAL */

const sorpresas = {
  1: "Bienvenido a nuestro calendario de Adviento.",
  2: "Aquí pondremos una sorpresa especial.",
  3: "Aquí irá una carta.",
  4: "Aquí irá un recuerdo.",
  5: "Aquí irá una sorpresa.",
  6: "Aquí irá un mensaje romántico.",
  7: "Aquí irá una canción.",
  8: "Aquí irá una anécdota.",
  9: "Aquí tendremos un quiz.",
  10: "Aquí irá una promesa.",
  11: "Aquí irá otro recuerdo.",
  12: "Aquí irá una carta especial.",
  13: "Aquí pondremos una fotografía.",
  14: "Aquí irá una nota de voz.",
  15: "Aquí tendremos una sorpresa divertida.",
  16: "Aquí irá otro detalle.",
  17: "Aquí irá una dedicatoria.",
  18: "Aquí pondremos un video.",
  19: "Aquí irá algo romántico.",
  20: "Aquí irá una pregunta especial.",
  21: "Aquí irá un vale de regalo.",
  22: "Aquí irá una sorpresa secreta.",
  23: "Aquí irá un mensaje especial.",
  24: "¡Feliz Navidad! Aquí irá nuestra gran sorpresa. ♡"
};

/* COLORES DE LAS PUERTAS */

const rosas = [15, 20, 3, 12];
const rosasClaros = [7, 13, 18, 16, 19, 6];

/* DESBLOQUEO POR FECHA */

function disponible(dia) {

  return modoPrueba ||
    new Date() >= new Date(2026, 11, dia);

}

function esHoy(dia) {

  const hoy = new Date();

  return hoy.getFullYear() === 2026 &&
    hoy.getMonth() === 11 &&
    hoy.getDate() === dia;

}

/* ABRIR SORPRESAS */

function abrirPuerta(dia) {

  const titulo = document.getElementById("tituloModal");
  const contenido = document.getElementById("contenidoModal");

  titulo.textContent = dia + " de diciembre";

  if (disponible(dia)) {

    contenido.textContent =
      sorpresas[dia] || "Aquí agregaremos una sorpresa especial.";

  } else {

    contenido.textContent =
      "Esta sorpresa se desbloqueará el " +
      dia + " de diciembre. ♡";

  }

  modal.showModal();

}

/* CREAR LAS 24 PUERTAS */

function renderizarCalendario() {

  calendario.innerHTML = "";

  for (let dia = 1; dia <= 24; dia++) {

    const puerta = document.createElement("button");

    puerta.className = "puerta";

    puerta.style.gridArea = "d" + dia;

    puerta.setAttribute(
      "aria-label",
      "Día " + dia + (disponible(dia) ? ", disponible" : ", bloqueado")
    );

    if (rosas.includes(dia)) {
      puerta.classList.add("rosa");
    }

    if (rosasClaros.includes(dia)) {
      puerta.classList.add("rosa-claro");
    }

    if (dia === 24) {

      puerta.classList.add("regalo");

      puerta.innerHTML = `
        <div class="cinta-vertical"></div>
        <div class="cinta-horizontal"></div>

        <svg class="lazo" viewBox="0 0 120 50"
          aria-hidden="true">
          <path
            d="M60 38 C5 42 -3 0 28 6
               C43 7 53 22 60 38
               C67 22 77 7 92 6
               C123 0 115 42 60 38"
            fill="none"
            stroke="#ffd9df"
            stroke-width="7"
            stroke-linecap="round"/>
        </svg>

        <span class="numero">24</span>
      `;

    } else {

      puerta.innerHTML = `
        <span class="numero">${dia}</span>
      `;

    }

    if (esHoy(dia)) {

      puerta.innerHTML += `<span class="hoy">Hoy</span>`;

    }

    puerta.onclick = () => abrirPuerta(dia);

    calendario.appendChild(puerta);

  }

}

/* MODO DE PRUEBA */

document.getElementById("modoPruebaBtn").onclick = function() {

  modoPrueba = !modoPrueba;

  this.textContent = modoPrueba
    ? "Desactivar modo de prueba"
    : "Activar modo de prueba";

  renderizarCalendario();

};

renderizarCalendario();

</script>

</body>
</html>
